<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="View and manage your submitted articles on SPOŠLearning.">
    <link rel="icon" type="image/x-icon" href="/media/logo.svg">
    <title>My Submissions – SPOŠLearning</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="/global.css" />
    <link rel="stylesheet" href="/navbar.css" />
    <link href="/account/submissions.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>
    <script type="module" src="/js/index.js"></script>
</head>

<body>

    <div id="nav">
        <div id="nav-left">
            <div id="nav-icon"><span class="icon">book_2</span></div>
            <div id="nav-grade-select-container">
                <button id="nav-grade-select">
                    <span id="grade-text">1st Grade</span>
                    <span class="icon" id="grade-select-drop-icon">arrow_drop_down</span>
                </button>
                <div id="grade-menu" class="hidden">
                    <button id="first-button" data-grade="1">1st Grade</button>
                    <button id="second-button" data-grade="2">2nd Grade</button>
                    <button id="third-button" data-grade="3">3rd Grade</button>
                    <button id="fourth-button" data-grade="4">4th Grade</button>
                </div>
            </div>
            <div id="breadcrumbs">
                <div class="crumb-item"><a href="/">Home</a><span class="separator">/</span></div>
                <div class="crumb-item current-crumb"><span class="current">My Submissions</span></div>
            </div>
        </div>
        <div id="search">
            <div id="search-box">
                <div id="search-icon"><span class="icon">search</span></div>
                <div id="search-input-div" style="flex:1;"><input id="search-input" type="text" placeholder="Search" /></div>
            </div>
            <div id="search-results-container" class="hidden"></div>
        </div>
        <div id="nav-right">
            <button id="login-button" class="nd"><span class="icon">login</span> Login</button>
            <div id="nav-profile" class="nd">
                <button id="account-button">
                    <span class="icon">person</span>
                    <span id="account-button-name">Name</span>
                    <span class="icon" id="account-button-drop-icon">arrow_drop_down</span>
                </button>
                <div id="account-menu" class="hidden">
                    <button id="dashboard-button" class="nd">Dashboard</button>
                    <button id="submissions-button">My Submissions</button>
                    <button id="settings-button">Settings</button>
                    <button id="feedback-button">Send Feedback</button>
                    <hr />
                    <button id="logout-button">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <main class="submissions-container">

        <header class="submissions-header">
            <div>
                <h1>My Submissions</h1>
                <p class="subtitle">Track, edit, and manage your article drafts submitted for review.</p>
            </div>
            <div class="header-actions">
                <a href="/submit" class="btn btn-primary">
                    <span class="icon">add_circle</span> New Submission
                </a>
            </div>
        </header>

        <!-- Status filter tabs -->
        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">All</button>
            <button class="tab-btn" data-filter="pending">
                <span class="tab-dot pending"></span>Pending Review
            </button>
            <button class="tab-btn" data-filter="needs_changes">
                <span class="tab-dot needs-changes"></span>Needs Changes
            </button>
            <button class="tab-btn" data-filter="approved">
                <span class="tab-dot approved"></span>Approved
            </button>
            <button class="tab-btn" data-filter="rejected">
                <span class="tab-dot rejected"></span>Rejected
            </button>
        </div>

        <!-- Submissions list -->
        <div id="submissions-list">
            <div class="loading-state">
                <span class="icon spinner">sync</span>
                <p>Loading your submissions…</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <a href="/privacy-policy">Zásady ochrany osobních údajů</a>
        &middot;
        <span>SPOŠLearning</span>
    </footer>

    <!-- Delete confirmation modal -->
    <div id="delete-modal" class="modal-backdrop hidden">
        <div class="modal-box">
            <div class="modal-icon-wrap danger">
                <span class="icon">delete_forever</span>
            </div>
            <h3>Delete Submission?</h3>
            <p id="delete-modal-desc">This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="delete-cancel-btn" class="btn btn-secondary">Cancel</button>
                <button id="delete-confirm-btn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden"></div>

    <script type="module" src="/account/js/submissions.js"></script>
</body>

</html>
