<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/media/logo.svg">
    <title>Change Password – SPOŠLearning</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="/navbar.css" />
    <link href="/account/reset-password.css" rel="stylesheet" />
    <script type="module" src="/js/index.js"></script>
</head>

<body>

<div id="nav">
        <div id="nav-left">
            <div id="nav-icon"><span class="icon">book_2</span></div>
            <div id="nav-grade-select-container">
                <button id="nav-grade-select">
                    <span id="grade-text">1st Grade</span>
                    <span class="icon" id="grade-select-drop-icon">arrow_drop_down</span>
                </button>
                <div id="grade-menu" class="hidden">
                    <button id="first-button" data-grade="1">1st Grade</button>
                    <button id="second-button" data-grade="2">2nd Grade</button>
                    <button id="third-button" data-grade="3">3rd Grade</button>
                    <button id="fourth-button" data-grade="4">4th Grade</button>
                </div>
            </div>
            <div id="breadcrumbs">
                <div class="crumb-item"><a href="/">Home</a><span class="separator">/</span></div>
                <div class="crumb-item current-crumb"><span class="current">Account / Change Password</span></div>
            </div>
        </div>
        <div id="search">
            <div id="search-box">
                <div id="search-icon"><span class="icon">search</span></div>
                <div id="search-input-div" style="flex:1;"><input id="search-input" type="text" placeholder="Search" />
                </div>
            </div>
            <div id="search-results-container" class="hidden"></div>
        </div>
        <div id="nav-right">
            <button id="login-button" class="nd"><span class="icon">login</span> Login</button>
            <div id="nav-profile" class="nd">
                <button id="account-button">
                    <span class="icon">person</span>
                    <span id="account-button-name">Name</span>
                    <span class="icon" id="account-button-drop-icon">arrow_drop_down</span>
                </button>
                <div id="account-menu" class="hidden">
                    <button id="dashboard-button" class="nd">Dashboard</button>
                    <button id="logs-button" class="nd">Audit Logs</button>
                    <button id="settings-button">Settings</button>
                    <button id="feedback-button">Send Feedback</button>
                    <hr />
                    <button id="logout-button">Logout</button>
                </div>
            </div>
        </div>
    </div>

<main class="reset-pwd-wrapper">
        <div class="reset-card">
            <h2 style="margin: 0 0 8px 0; font-size: 1.6rem; font-weight: 700;">Change Password</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 24px 0;">Update your account password
                securely.</p>

            <form id="change-pwd-form" style="display: flex; flex-direction: column; gap: 16px;">
                <div class="input-group">
                    <span class="icon">lock</span>
                    <input type="password" id="current-password" placeholder="Current Password" required />
                </div>

                <div class="input-group">
                    <span class="icon">key</span>
                    <input type="password" id="new-password" placeholder="New Password (min 8 chars)" required
                        minlength="8" />
                </div>

                <div class="input-group">
                    <span class="icon">key_vertical</span>
                    <input type="password" id="confirm-password" placeholder="Confirm New Password" required
                        minlength="8" />
                </div>

                <div id="change-pwd-status" class="hidden"></div>

                <button type="submit" id="submit-change-btn" class="btn-submit-pwd">Update Password</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <a href="/privacy-policy">Zásady ochrany osobních údajů</a>
        &middot;
        <span>SPOŠLearning</span>
    </footer>

    <script type="module" src="/account/js/reset-password.js"></script>
</body>

</html>
