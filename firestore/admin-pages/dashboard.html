<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - SPOŠLearning</title>
    <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <link id="theme-link" href="/style/theme-dark.css" rel="stylesheet" />
    <script src="/js/theming.js" type="module"></script>
    <link href="/style/variables-global.css" rel="stylesheet" />
    <link rel="stylesheet" href="/style/base.css" />
    <link rel="stylesheet" href="/style/components.css" />
    <link rel="stylesheet" href="/style/custom-el.css" />
    <link rel="stylesheet" href="/style/mobile.css" />
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
<div id="secure">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1>Dashboard</h1>
            <div class="d-flex" style="gap: 20px">
                <a href="https://sposlearning.cz/"
                ><button
                        class="btn btn-primary"
                        id="home-button"
                        style="
                  border-radius: 999px !important;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  width: 50px;
                  height: 50px;
                  padding: 0;
                ">
                <span
                        class="material-symbols-outlined"
                        style="font-size: 28px; line-height: 1">
                  home
                </span>
                </button></a
                >
                <button
                        class="btn btn-danger"
                        id="logout-button"
                        style="border-radius: 999px !important">
                    Logout
                </button>
            </div>
        </div>
        <hr />

        <div class="box-row">
            <div class="box">
                <div class="col">
                    <icon class="boxed clr1">add_circle</icon>
                    <h2 class="boxed">Přidání článku</h2>
                    <div class="text boxed">
                        Tady se přidávají články. No comment.
                    </div>
                    <a href="/add-page"
                    ><button class="btn btn-primary mt-3">Otevřít</button></a
                    >
                </div>
            </div>
            <div class="box">
                <div class="col">
                    <icon class="boxed clr3">chat</icon>
                    <h2 class="boxed">Zpětná vazba</h2>
                    <div class="text boxed">
                        Zde se můžeš podívat na zpětnou vazbu. Na to přijdeš není to
                        těžký.
                    </div>
                    <a href="/feedback"
                    ><button class="btn btn-warning mt-3">Otevřít</button></a
                    >
                </div>
            </div>
        </div>
        <div class="box-row">
            <div class="box">
                <div class="col">
                    <icon class="boxed clr2">history</icon>
                    <h2 class="boxed">Systémové logy</h2>
                    <div class="text boxed">
                        Přehled událostí a záznamů v systému.
                    </div>
                    <a href="/logs/"
                    ><button class="btn btn-secondary mt-3">Otevřít</button></a
                    >
                </div>
            </div>
            <div class="box" style="opacity: 0;">
                <div class="col">
                    <icon class="boxed clr2">history</icon>
                    <h2 class="boxed">Logy</h2>
                    <div class="text boxed">
                        Přehled událostí a logů v systému.
                    </div>
                    <a href="/logs/"
                    ><button class="btn btn-info mt-3">Otevřít</button></a
                    >
                </div>
            </div>
        </div>
    </div>
</div>

<script src="dashboard.js" type="module"></script>
</body>
</html>
