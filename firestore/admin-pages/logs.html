<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - SPOŠLearning</title>
    <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <link id="theme-link" href="/style/theme-dark.css" rel="stylesheet" />
    <script src="/js/theming.js" type="module"></script>
    <link href="/style/variables-global.css" rel="stylesheet" />
    <link rel="stylesheet" href="/style/base.css" />
    <link rel="stylesheet" href="/style/components.css" />
    <link rel="stylesheet" href="/style/custom-el.css" />
    <link rel="stylesheet" href="/style/mobile.css" />
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
<div id="secure">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1>Logy</h1>
            <div class="d-flex" style="gap: 20px">
                <a href="/">
                    <button class="btn btn-primary" id="home-button" style="border-radius: 999px !important; display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; padding: 0;">
                        <span class="material-symbols-outlined" style="font-size: 28px; line-height: 1">
                            home
                        </span>
                    </button>
                </a>
            </div>
        </div>
        <hr />

        <div class="table-responsive mt-4">
            <table class="table" style="color: var(--root-txt-clr);">
                <thead>
                <tr>
                    <th scope="col">Datum a čas</th>
                    <th scope="col">Uživatel</th>
                    <th scope="col">Akce</th>
                </tr>
                </thead>
                <tbody id="logs-tbody">
                <tr>
                    <td colspan="3" class="text-center">Načítání logů...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="logs.js" type="module"></script>
</body>
</html>
