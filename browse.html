<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse all available articles and study notes on SPOŠLearning, organized by subject.">
    <link rel="icon" type="image/x-icon" href="/media/logo.svg">
    <title>Browse Pages – SPOŠLearning</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="/global.css" />
    <link rel="stylesheet" href="/navbar.css" />
    <link rel="stylesheet" href="/browse.css" />
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>
    <script type="module" src="/js/index.js"></script>
</head>

<body>

<div id="nav">
    <div id="nav-left">
        <div id="nav-icon"><span class="icon">book_2</span></div>
        <div id="nav-grade-select-container">
            <button id="nav-grade-select">
                <span id="grade-text">1st Grade</span>
                <span class="icon" id="grade-select-drop-icon">arrow_drop_down</span>
            </button>
            <div id="grade-menu" class="hidden">
                <button id="first-button">1st Grade</button>
                <button id="second-button">2nd Grade</button>
                <button id="third-button">3rd Grade</button>
                <button id="fourth-button">4th Grade</button>
            </div>
        </div>
        <div id="breadcrumbs">
            <div class="crumb-item"><a href="/">Home</a><span class="separator">/</span></div>
            <div class="crumb-item current-crumb"><span class="current">Browse</span></div>
        </div>
    </div>
    <div id="search">
        <div id="search-box">
            <div id="search-icon"><span class="icon">search</span></div>
            <div id="search-input-div" style="flex:1;"><input id="search-input" type="text" placeholder="Search" /></div>
        </div>
        <div id="search-results-container" class="hidden"></div>
    </div>
    <div id="nav-right">
        <button id="login-button" class="nd"><span class="icon">login</span> Login</button>
        <div id="nav-profile" class="nd">
            <button id="account-button">
                <span class="icon">person</span>
                <span id="account-button-name">Name</span>
                <span class="icon" id="account-button-drop-icon">arrow_drop_down</span>
            </button>
            <div id="account-menu" class="hidden">
                <button id="dashboard-button" class="nd">Dashboard</button>
                <button id="submissions-button">My Submissions</button>
                <button id="settings-button">Settings</button>
                <button id="feedback-button">Send Feedback</button>
                <hr />
                <button id="logout-button">Logout</button>
            </div>
        </div>
    </div>
</div>

<main class="browse-root">

    <div class="browse-header">
        <div class="browse-header-left">
            <h1>Browse Pages</h1>
            <p class="browse-subtitle" id="grade-subtitle">Showing pages for 1st Grade</p>
        </div>
        <div class="browse-header-right">
            <div class="browse-search-wrap">
                <span class="icon browse-search-icon">filter_list</span>
                <input id="browse-filter" type="text" placeholder="Filter by title or path…" autocomplete="off" />
                <button id="browse-filter-clear" class="browse-filter-clear hidden" title="Clear filter">
                    <span class="icon">close</span>
                </button>
            </div>
            <button id="expand-all-btn" class="btn-tree-action" title="Expand all">
                <span class="icon">unfold_more</span>
            </button>
            <button id="collapse-all-btn" class="btn-tree-action" title="Collapse all">
                <span class="icon">unfold_less</span>
            </button>
        </div>
    </div>

    <div id="browse-stats" class="browse-stats hidden">
        <span class="icon">description</span>
        <span id="browse-stats-text"></span>
    </div>

    <div id="browse-tree" role="tree" aria-label="Pages tree">
        <div class="tree-loading">
            <span class="icon spinner">sync</span>
            <p>Loading pages…</p>
        </div>
    </div>

</main>

<footer class="site-footer">
    <a href="/privacy-policy">Zásady ochrany osobních údajů</a>
    &middot;
    <span>SPOŠLearning</span>
</footer>

<script type="module" src="/js/browse.js"></script>
</body>
</html>
