<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Feedback - SPOŠLearning</title>

    <link rel="icon" type="image/x-icon" href="/media/logo.svg">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link id="theme-link" href="/style/theme-dark.css" rel="stylesheet">
    <link href="/style/variables-global.css" rel="stylesheet">
    <link href="/style/feedback.css" rel="stylesheet">
    <link href="/style/components.css" rel="stylesheet">

    <script src="/js/theming.js" type="module"></script>

    <link rel="stylesheet" href="/style/base.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        #filter-button {
            background-color: var(--root-box-bg-clr) !important;
            color: var(--root-fg-clr) !important;
            border: 1px solid var(--box-border-clr) !important;
            border-radius: var(--box-border-radius) !important;

            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            aspect-ratio: auto !important;
        }

        #filter-button icon {
            font-size: var(--icon-tiny);
        }

        #direction-toggle {
            background-color: var(--root-box-bg-clr) !important;
            color: var(--root-fg-clr) !important;
            border: 1px solid var(--box-border-clr) !important;
            border-radius: var(--box-border-radius) !important;
        }

        .rotate-180 {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

<div class="dot-container">
    <div class="dot"></div>
</div>

<div id="secure-container">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center">
            <h1>Feedback Inbox</h1>
            <a href="/" class="btn btn-secondary">Dashboard</a>
        </div>
        <hr>

        <div class="row mb-3">
            <div class="col-md-4 d-flex align-items-center">
                <button id="filter-button" class="mr-2" style="background-color: var(--root-box-bg-clr); color: var(--root-fg-clr); border-color: var(--box-border-clr); border-radius: var(--box-border-radius);">
                    <icon>
                        filter_alt
                    </icon>
                    <span>Filtrování</span>
                </button>
                <div class="feedback-search">
                    <icon>search</icon>
                    <input id="search-input" placeholder="Hledej..." type="text">
                </div>
            </div>
        </div>

        <div id="loading" class="text-center" style="color: var(--root-fgd-clr);">Loading feedback...</div>

        <div id="feedback-list" class="list-group">
        </div>
    </div>
</div>

<div id="filter-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(8px);">
    <div style="background-color: var(--root-box-bg-clr); border: 1px solid var(--box-border-clr); padding: 30px; border-radius: var(--box-border-radius); width: 90%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);">
        <h3 style="margin-top: 0; color: var(--primary-hl-clr);">Placeholder</h3>

        <p style="color: var(--root-txt-clr);">This don't work yet pls nepoužívat - Tadeáš (toto je opravdu human kód)</p>
        <div class="d-flex align-items-center gap-2 mb-3" style="gap: 20px !important;">
            <select id="sort-select" class="form-control" style="background-color: var(--root-box-bg-clr); color: var(--root-fg-clr); border-color: var(--box-border-clr); border-radius: var(--box-border-radius); padding: 0 8px;">
                <option value="priority">Priority</option>
                <option value="date">Date</option>
            </select>

            <button id="direction-toggle" class="btn btn-outline-secondary d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; border-radius: var(--box-border-radius); flex-shrink: 0;">
                <icon id="direction-icon" style="transition: transform 0.3s ease; font-size: var(--icon-small);">
                    arrow_upward
                </icon>
            </button>
        </div>
        <div class="custom-control custom-switch">
            <input type="checkbox" class="custom-control-input" id="hide-resolved" style="border-radius: var(--box-border-radius);">
            <label class="custom-control-label" for="hide-resolved">Hide Resolved</label>
        </div>
        <div class="custom-control custom-switch" id="resolved-on-bottom-container">
            <input type="checkbox" class="custom-control-input" id="resolved-on-bottom" style="border-radius: var(--box-border-radius);">
            <label class="custom-control-label" for="resolved-on-bottom">Resolved on bottom</label>
        </div>
        <div class="custom-control custom-switch">
            <input type="checkbox" class="custom-control-input" id="hide-in-progress" style="border-radius: var(--box-border-radius);">
            <label class="custom-control-label" for="hide-in-progress">Hide In Progress</label>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button id="modal-cancel-btn" class="btn btn-sm btn-secondary">Close</button>
        </div>
    </div>
</div>

<script type="module" src="/feedback.js"></script>
<script src="/js/notice.js"></script>
</body>
</html>
