<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - SPOŠLearning Admin</title>

    <link rel="icon" type="image/x-icon" href="/media/logo.svg">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link id="theme-link" href="/style/theme-dark.css" rel="stylesheet">

    <script src="/js/theming.js" type="module"></script>

    <link href="/style/variables-global.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/base.css">
    <link rel="stylesheet" href="/style/components.css">
    <link rel="stylesheet" href="/style/custom-el.css">
    <link rel="stylesheet" href="/style/mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .btn-group {
            gap: 10px;
        }
    </style>
</head>
<body>

<div id="secure-container">
    <div class="container-fluid mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>User Management</h2>
            <div class="d-flex gap-2 align-items-center">
                <input type="text" id="user-search" class="form-control form-control-sm" style="background-color: var(--root-box-bg-clr); color: var(--root-fg-clr); border-color: var(--box-border-clr); border-radius: var(--box-border-radius); padding: 0 8px;" placeholder="Search email or name...">
                <a href="/" class="btn btn-secondary btn-sm">Dashboard</a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="data-table">
                <thead>
                <tr>
                    <th>User</th>
                    <th>Status</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="user-list-tbody">
                <tr><td colspan="4" class="text-center" style="color: var(--root-fgd-clr);">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module" src="/users.js"></script>
<script src="/js/notice.js"></script>
</body>
</html>
