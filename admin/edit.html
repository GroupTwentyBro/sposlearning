<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Page</title>

    <link rel="icon" type="image/x-icon" href="/media/logo.svg">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link id="theme-link" href="/style/theme-dark.css" rel="stylesheet">
    <link href="/style/variables-global.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/base.css">
    <link rel="stylesheet" href="/style/forms.css">
    <link rel="stylesheet" href="/style/mobile.css">

    <script src="/js/theming.js" type="module"></script>

    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

<div class="dot-container">
    <div class="dot"></div>
</div>

<div id="secure-container">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center">
            <h1>Edit Page</h1>
            <a href="/" class="btn btn-secondary">Zpět na Dashboard</a>
        </div>
        <hr>

        <form id="edit-form" class="mt-3">
            <div class="form-group">
                <label>Page URL (Path)</label>
                <input
                        type="text"
                        class="form-control"
                        id="page-url-display"
                        placeholder="folder/page-name"
                        required
                        pattern="^[a-z0-9/-]+$"
                        title="Only lowercase letters, numbers, hyphens, and slashes allowed.">
                <small class="form-text text-muted">Example: <code>courses/javascript-101</code></small>
            </div>

            <div class="form-group">
                <label for="page-title">Page Title (For Search)</label>
                <input type="text" class="form-control" id="page-title" required>
            </div>

            <div class="form-group mt-2 mb-0">
                <div class="custom-control custom-checkbox">
                    <input type="checkbox" class="custom-control-input" id="page-is-admin">
                    <label class="custom-control-label" for="page-is-admin">
                        <strong>Admin Only</strong>
                        <span class="text-muted" style="font-weight: normal;">(Hide from public search results)</span>
                    </label>
                </div>
            </div>
            <hr>

            <div class="form-group" id="editor-markdown" style="display: none;">
                <label for="md-content">Markdown Content</label>
                <textarea class="form-control" id="md-content" rows="10"></textarea>
            </div>

            <div class="form-group" id="editor-html" style="display: none;">
                <label for="html-content">Raw HTML Content</label>
                <textarea class="form-control" id="html-content" rows="10"></textarea>
            </div>

            <button type="submit" class="btn btn-primary mt-3" id="save-button">Save Changes</button>
            <p id="page-status" class="mt-2"></p>
        </form>
    </div>
</div>

<script src="/edit.js" type="module"></script>
<script src="/js/notice.js"></script>
</body>
</html>
