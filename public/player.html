<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'
        https://lrclib.net
        https://proxy.piped.private.coffee
        https://i.ytimg.com
        https://*.googleapis.com
        https://*.gstatic.com
        https://*.sposlearning.cz
        https://cdn.jsdelivr.net
        https://fonts.googleapis.com
        https://cdn.jsdelivr.net;">
    <title>Fluid Lyric Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --track-color: #ffffff;
            --track-glow: #ffffff;
            --lyric-blur: 20px;
            --lyric-dim: 0.65;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%; overflow: hidden;
            color: white; background: #000;
            font-family: "Google Sans", sans-serif;
        }

        .bg-blur {
            position: absolute;
            inset: -35%;
            background-size: cover; background-position: center;
            filter: blur(60px) brightness(0.4) saturate(1.4);
            transform: scale(1.15); z-index: 1;
            transition: background-image 1s ease;
            background-repeat: no-repeat;
        }

        .player-content {
            position: relative; z-index: 2;
            display: flex; flex-direction: row; align-items: stretch;
            height: 100vh; background: rgba(0,0,0,0.3); padding: 24px;
        }

        .cover-art {
            flex-shrink: 0; height: min(70vh, 500px); width: min(70vh, 500px);
            margin: auto 24px; border-radius: 16px;
            background-size: 180% auto; background-position: center;
            box-shadow: 0 24px 80px rgba(0,0,0,0.85); display: block;
        }

        .main-info {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; padding: 0 16px; min-width: 0; text-align: left;
        }

        @media (max-aspect-ratio: 1/1) or (max-width: 768px) {
            .player-content { flex-direction: column; justify-content: center; align-items: center; text-align: center; }
            .cover-art { width: 80vw; height: 80vw; max-width: 320px; max-height: 320px; margin: 0 0 32px 0; }
            .main-info { padding: 0; width: 100%; text-align: center; }
            .btn-row { justify-content: center; }
            .volume-wrap { display: none; }
        }

        h1 { font-size: clamp(20px, 2.5vw, 32px); font-weight: 700; line-height: 1.2; }
        p#meta { opacity: 0.55; margin-top: 8px; font-size: clamp(13px, 1.5vw, 17px); }

        .controls { margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
        .progress-wrap { display: flex; align-items: center; gap: 10px; }
        .time-label { font-size: 12px; opacity: 0.5; font-variant-numeric: tabular-nums; min-width: 34px; }

        .progress-track { flex: 1; height: 4px; background: rgba(255,255,255,0.18); border-radius: 2px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; border-radius: 2px; background: white; width: 0%; pointer-events: none; }
        .progress-thumb { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: white; transform: translate(-50%, -50%); left: 0%; opacity: 0; transition: opacity 0.15s; }
        .progress-track:hover .progress-thumb { opacity: 1; }

        .btn-row { display: flex; align-items: center; gap: 6px; }
        .ctrl-btn { background: none; border: none; color: white; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0.7; transition: 0.15s; }
        .ctrl-btn:hover { opacity: 1; background: rgba(255,255,255,0.1); }
        .ctrl-btn.play-pause { width: 60px; height: 60px; background: rgba(255,255,255,0.15); opacity: 1; }
        .ctrl-btn.play-pause .material-symbols-rounded { font-size: 36px; font-variation-settings: 'FILL' 1; }

        .volume-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .volume-slider { -webkit-appearance: none; width: 72px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: white; cursor: pointer; }

        .lyric-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 24px; border-radius: 20px; cursor: pointer; transition: background 0.2s; font-weight: 600; font-size: 14px; }

        #loading-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: #000; display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
            transition: opacity 0.6s ease;
        }
        #loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.15);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { opacity: 0.5; font-size: 14px; }

        #error-banner {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,60,60,0.15); border: 1px solid rgba(255,60,60,0.3);
            backdrop-filter: blur(10px); color: white; padding: 12px 24px;
            border-radius: 50px; font-size: 14px; z-index: 300;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #error-banner.show { opacity: 1; }

        #status-message {
            position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px; font-size: 18px; font-weight: 500; color: white;
            z-index: 1000; opacity: 0; visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease; pointer-events: none;
        }
        #status-message.show { opacity: 1; visibility: visible; }

        #lyrics-screen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; overflow-y: auto; background: #000;
            opacity: 0; pointer-events: none;
            transition: opacity 1.2s ease;
        }
        #lyrics-screen.active { opacity: 1; pointer-events: auto; }

        #lyrics-bg {
            position: fixed; inset: -35%;
            background-size: cover; background-position: center;
            background-repeat: no-repeat; z-index: -2;
            transition: filter 1s ease, transform 1s ease;
        }

        #lyrics-video {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; opacity: 0;
            filter: blur(5px) brightness(var(--lyric-dim)) saturate(1.3);
            transform: scale(1.08);
            transition: opacity 1s ease, filter 1s ease, transform 1s ease;
        }

        #lyrics-video.unfiltered {
            filter: none;
            transform: none;
        }

        .lyric-view-filtered {
            filter: blur(5px) brightness(var(--lyric-dim)) saturate(1.3);
            transform: scale(1.08);
        }

        #lyrics-container {
            position: relative; z-index: 2; width: 100%; max-width: 780px;
            padding: 50vh 24px; display: flex; flex-direction: column; align-items: center;
            transition: opacity 0.8s ease;
        }

        .lyric-line {
            font-size: clamp(22px, 4vw, 38px); font-weight: 800; line-height: 1.35;
            margin: 13px 0; text-align: center; width: 100%;
            opacity: var(--line-opacity, 0.18); transition: opacity 0.5s ease;
        }

        .word { display: inline-block; position: relative; color: rgba(255,255,255,0.2); transform: translateY(calc(var(--fill, 0) * (var(--fill, 0) - 100) * 0.0008px)); }
        .word::before { content: attr(data-text); position: absolute; inset: 0; color: var(--track-color); clip-path: inset(0 calc((100 - var(--fill, 0)) * 1%) 0 0); white-space: nowrap; pointer-events: none; }
        .word::after {
            content: attr(data-text); position: absolute; inset: 0; color: transparent;
            text-shadow: 0 0 16px rgba(255,255,255,0.7), 0 0 35px var(--track-glow), 0 0 70px var(--track-glow), 0 0 110px var(--track-glow);
            opacity: calc(var(--fill, 0) / 100 * 0.9); white-space: nowrap; pointer-events: none; z-index: -1;
        }

        .close-lyrics { position: fixed; top: 26px; right: 28px; cursor: pointer; z-index: 103; opacity: 0.65; }
        .material-symbols-rounded { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; color: white; }
        canvas#colorThief { display: none; }

        #no-lyrics-msg {
            opacity: 0.4; font-size: 18px; font-weight: 600; text-align: center;
            margin-top: 40px; display: none;
        }

        #source-selector {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 20px;
            outline: none;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }
        #source-selector:hover { background: rgba(255,255,255,0.15); }
        #source-selector option { background: #111; color: white; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="loading-spinner"></div>
    <div id="loading-text">Loading track…</div>
</div>
<div id="error-banner"></div>

<div class="bg-blur" id="bg"></div>
<canvas id="colorThief"></canvas>
<div id="status-message">Lyrics will appear shortly</div>

<div class="player-content">
    <div class="cover-art" id="art"></div>
    <div class="main-info">
        <h1 id="title">Select Track</h1>
        <p id="meta">Artist • Album</p>
        <div class="controls">
            <div class="progress-wrap">
                <span class="time-label" id="time-cur">0:00</span>
                <div class="progress-track" id="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                    <div class="progress-thumb" id="progress-thumb"></div>
                </div>
                <span class="time-label right" id="time-dur">0:00</span>
            </div>
            <div class="btn-row">
                <button class="ctrl-btn" id="btn-back"><span class="material-symbols-rounded">replay_10</span></button>
                <button class="ctrl-btn play-pause" id="btn-play">
                    <span class="material-symbols-rounded" id="icon-play">play_arrow</span>
                    <span class="material-symbols-rounded" id="icon-pause" style="display:none">pause</span>
                </button>
                <button class="ctrl-btn" id="btn-fwd"><span class="material-symbols-rounded">forward_10</span></button>
                <div class="volume-wrap">
                    <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
                <button class="lyric-btn" id="lyrics-toggle-btn" onclick="toggleLyrics()">Lyrics</button>
            </div>
        </div>
    </div>
</div>

<div id="lyrics-screen">
    <video id="lyrics-video" muted playsinline></video>
    <div id="lyrics-bg"></div>

    <span class="close-lyrics" onclick="toggleLyrics()">
        <span class="material-symbols-rounded" style="font-size: 36px;">close</span>
    </span>

    <div id="lyric-controls" style="position: fixed; bottom: 30px; right: 30px; z-index: 110;">
        <select id="source-selector" onchange="switchSource()">
            <option value="ttml">Source: TTML (Local)</option>
            <option value="lrc">Source: LRCLIB (Cloud)</option>
        </select>
    </div>

    <div id="lyrics-container">
        <div id="no-lyrics-msg">No lyrics available for this track.</div>
    </div>

    <div id="lyric-editor" style="display: none; position: relative; z-index: 10; width: 100%; max-width: 600px; margin: auto; padding: 20px;">
        <textarea id="ttml-input" placeholder="Paste your <tt>...</tt> content here..."
                  style="width: 100%; height: 250px; background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 15px; font-family: monospace; font-size: 11px; margin-bottom: 15px; outline: none;"></textarea>
        <div style="display:flex; gap: 10px; justify-content: center;">
            <button class="lyric-btn" onclick="submitLyrics()">Save to Database</button>
            <button class="lyric-btn" style="background: rgba(255,255,255,0.05);" onclick="closeEditor()">Cancel</button>
        </div>
    </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
    const API_BASE = 'https://music.sposlearning.cz';
    const params   = new URLSearchParams(window.location.search);
    const videoId  = params.get('v') ?? params.get('track');

    const audio    = document.getElementById('audio');
    const video    = document.getElementById('lyrics-video');
    const lyricsEl = document.getElementById('lyrics-screen');
    const container= document.getElementById('lyrics-container');
    const lBg      = document.getElementById('lyrics-bg');
    const statusMsg= document.getElementById('status-message');
    const loadingEl= document.getElementById('loading-overlay');
    const errorEl  = document.getElementById('error-banner');
    const noLyrics = document.getElementById('no-lyrics-msg');
    const lyricEditor = document.getElementById('lyric-editor');
    const ttmlInput = document.getElementById('ttml-input');
    const sourceSelector = document.getElementById('source-selector');

    const INSTRUMENTAL_GAP = 4;
    let userWantsLyrics = false;
    let hasLyrics = false;
    let videoAvailable = false;
    let totalDurationSeconds = 0;

    let currentSource = 'ttml';
    let rawTTML = null;
    let rawLRC = null;

    function showError(msg, duration = 4000) {
        errorEl.textContent = msg;
        errorEl.classList.add('show');
        setTimeout(() => errorEl.classList.remove('show'), duration);
    }

    function hideLoading() {
        loadingEl.classList.add('hidden');
        setTimeout(() => loadingEl.style.display = 'none', 700);
    }

    function setScreenVisible(visible) {
        lyricsEl.classList.toggle('active', visible);
    }

    function parseTime(t) {
        if (!t) return 0;
        const parts = t.split(':').map(parseFloat);
        if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
        if (parts.length === 2) return (parts[0] * 60) + parts[1];
        return parts[0];
    }

    function formatTime(s) {
        if (!isFinite(s) || isNaN(s)) return '0:00';
        return Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0');
    }

    function extractColor(img) {
        const canvas = document.getElementById('colorThief');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.height = 40;
        ctx.drawImage(img, 0, 0, 40, 40);
        const data = ctx.getImageData(0, 0, 40, 40).data;
        let rS = 0, gS = 0, bS = 0, n = 0;
        for (let i = 0; i < data.length; i += 4) {
            const lum = 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2];
            if (lum < 20 || lum > 230) continue;
            rS += data[i]; gS += data[i+1]; bS += data[i+2]; n++;
        }
        if (!n) return;
        const gr = Math.min(255, Math.max(0, Math.round(128 + (rS/n - 128) * 2.2)));
        const gg = Math.min(255, Math.max(0, Math.round(128 + (gS/n - 128) * 2.2)));
        const gb = Math.min(255, Math.max(0, Math.round(128 + (bS/n - 128) * 2.2)));
        document.documentElement.style.setProperty('--track-glow', `rgb(${gr},${gg},${gb})`);
        document.documentElement.style.setProperty('--track-color', `rgb(${Math.round(gr*0.15+216)},${Math.round(gg*0.15+216)},${Math.round(gb*0.15+216)})`);
    }

    function parseTTML(ttml) {
        container.innerHTML = '';
        noLyrics.style.display = 'none';
        const xml = new DOMParser().parseFromString(ttml, 'text/xml');
        let count = 0;
        for (const p of xml.getElementsByTagName('p')) {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'lyric-line';
            let sTime = Infinity, eTime = -Infinity;
            Array.from(p.childNodes).forEach(node => {
                if (node.nodeType === 1 && node.tagName.toLowerCase() === 'span') {
                    const start = parseTime(node.getAttribute('begin'));
                    const end   = parseTime(node.getAttribute('end'));
                    sTime = Math.min(sTime, start);
                    eTime = Math.max(eTime, end);
                    const word = document.createElement('span');
                    word.className = 'word';
                    word.textContent = node.textContent;
                    word.dataset.text = node.textContent;
                    word.dataset.start = start;
                    word.dataset.end = end;
                    lineDiv.appendChild(word);
                } else if (node.nodeType === 3) {
                    lineDiv.appendChild(document.createTextNode(node.textContent));
                }
            });
            lineDiv.dataset.start = sTime;
            lineDiv.dataset.end = eTime;
            container.appendChild(lineDiv);
            count++;
        }
        container.appendChild(noLyrics);
        return count;
    }

    function parseLRC(lrc) {
        container.innerHTML = '';
        noLyrics.style.display = 'none';
        const lineRegex = /^\[(\d+):(\d+(?:\.\d+)?)\](.*)/;
        const lines = lrc.split('\n')
            .map(l => l.trim())
            .filter(l => lineRegex.test(l))
            .map(l => {
                const m = l.match(lineRegex);
                return { time: parseInt(m[1]) * 60 + parseFloat(m[2]), text: m[3].trim() };
            })
            .filter(l => l.text);

        lines.forEach((line, i) => {
            const end = lines[i + 1]?.time ?? (line.time + 5);
            const lineDiv = document.createElement('div');
            lineDiv.className = 'lyric-line lrc-line';
            lineDiv.dataset.start = line.time;
            lineDiv.dataset.end   = end;
            lineDiv.textContent   = line.text;
            container.appendChild(lineDiv);
        });

        container.appendChild(noLyrics);
        return lines.length;
    }

    async function init() {
        if (!videoId) {
            document.getElementById('title').textContent = 'No track specified';
            document.getElementById('meta').textContent = 'Add ?v=VIDEO_ID to the URL';
            hideLoading();
            return;
        }

        let trackData;
        try {
            document.getElementById('loading-text').textContent = 'Fetching track info…';
            const trackRes = await fetch(`${API_BASE}/track/${videoId}`);
            trackData = await trackRes.json();
            const cleanArtist = trackData.artist.replace(/\s*-\s*Topic$/i, '').trim();
            document.getElementById('title').textContent = trackData.title;
            document.getElementById('meta').textContent = [cleanArtist, trackData.album].filter(Boolean).join(' • ');

            const thumbUrl = trackData.thumbnail;
            const artStyle = `url('${thumbUrl}')`;
            document.getElementById('bg').style.backgroundImage  = artStyle;
            document.getElementById('art').style.backgroundImage = artStyle;
            lBg.style.backgroundImage = artStyle;

            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => extractColor(img);
            img.src = thumbUrl;

            if (trackData.duration) {
                totalDurationSeconds = parseFloat(trackData.duration);
                document.getElementById('time-dur').textContent = formatTime(totalDurationSeconds);
            }
        } catch (err) { showError(`Metadata error: ${err.message}`); }

        audio.src = `${API_BASE}/stream/${videoId}`;

        try {
            const vUrl = `${API_BASE}/video/${videoId}`;
            const vCheck = await fetch(vUrl, { method: 'HEAD' });
            if (vCheck.ok) {
                video.src = vUrl;
                videoAvailable = true;
            }
        } catch (e) { videoAvailable = false; }

        try {
            const lyricsRes = await fetch(`${API_BASE}/lyrics/${videoId}`);
            if (lyricsRes.ok) {
                rawTTML = await lyricsRes.text();
                hasLyrics = parseTTML(rawTTML) > 0;
                currentSource = 'ttml';
                sourceSelector.value = 'ttml';
            }
        } catch (_) {}

        if (!rawTTML && trackData) {
            try {
                const cleanArtist = trackData.artist.replace(/\s*-\s*Topic$/i, '').trim();
                const q = new URLSearchParams({
                    track_name:  trackData.title,
                    artist_name: cleanArtist,
                    ...(trackData.album ? { album_name: trackData.album } : {}),
                    ...(trackData.duration ? { duration: Math.round(trackData.duration) } : {}),
                });
                const lrcRes = await fetch(`https://lrclib.net/api/get?${q}`);
                if (lrcRes.ok) {
                    const lrc = await lrcRes.json();
                    if (lrc.syncedLyrics) {
                        rawLRC = lrc.syncedLyrics;
                        hasLyrics = parseLRC(rawLRC) > 0;
                        currentSource = 'lrc';
                        sourceSelector.value = 'lrc';
                    }
                }
            } catch (_) {}
        }

        if (!hasLyrics) {
            noLyrics.style.display = 'block';
            sourceSelector.value = 'ttml';
        }

        hideLoading();
        requestAnimationFrame(sync);
    }

    const btnPlay = document.getElementById('btn-play');
    const iPlay   = document.getElementById('icon-play');
    const iPause  = document.getElementById('icon-pause');
    const f       = document.getElementById('progress-fill');
    const th      = document.getElementById('progress-thumb');
    const cur     = document.getElementById('time-cur');
    const dur     = document.getElementById('time-dur');

    btnPlay.addEventListener('click', () => audio.paused ? audio.play() : audio.pause());
    audio.addEventListener('play',  () => {
        iPlay.style.display = 'none'; iPause.style.display = 'block';
        if(videoAvailable && userWantsLyrics) video.play();
    });
    audio.addEventListener('pause', () => {
        iPlay.style.display = 'block'; iPause.style.display = 'none';
        if(videoAvailable) video.pause();
    });

    audio.addEventListener('timeupdate', () => {
        const duration = totalDurationSeconds || audio.duration;
        if (duration && isFinite(duration) && duration > 0) {
            const safePct = (audio.currentTime / duration) * 100;
            f.style.width = th.style.left = Math.min(100, Math.max(0, safePct)) + '%';
            cur.textContent = formatTime(audio.currentTime);
        }
    });

    audio.addEventListener('seeking', () => { if (videoAvailable) video.currentTime = audio.currentTime; });

    document.getElementById('btn-back').addEventListener('click', () => audio.currentTime -= 10);
    document.getElementById('btn-fwd').addEventListener('click',  () => audio.currentTime += 10);
    document.getElementById('volume-slider').addEventListener('input', e => audio.volume = e.target.value);

    let scrubbing = false;
    document.getElementById('progress-track').addEventListener('mousedown', e => { scrubbing = true; scrubTo(e); });
    window.addEventListener('mousemove', e => scrubbing && scrubTo(e));
    window.addEventListener('mouseup', () => scrubbing = false);
    function scrubTo(e) {
        const r = document.getElementById('progress-track').getBoundingClientRect();
        const duration = totalDurationSeconds || audio.duration;
        if (duration && isFinite(duration)) audio.currentTime = ((e.clientX - r.left) / r.width) * duration;
    }

    function isInstrumentalAt(time, allLines) {
        if (allLines.length === 0) return false;
        const firstStart = parseFloat(allLines[0].dataset.start);
        const lastEnd    = parseFloat(allLines[allLines.length - 1].dataset.end);
        if (time < firstStart - INSTRUMENTAL_GAP || time > lastEnd + INSTRUMENTAL_GAP) return true;
        for (let i = 0; i < allLines.length - 1; i++) {
            const gapStart = parseFloat(allLines[i].dataset.end);
            const gapEnd   = parseFloat(allLines[i+1].dataset.start);
            if ((gapEnd - gapStart) > INSTRUMENTAL_GAP && time > gapStart && time < gapEnd) return true;
        }
        return false;
    }

    function switchSource() {
        const val = sourceSelector.value;
        currentSource = val;

        if (val === 'ttml') {
            if (rawTTML) {
                lyricEditor.style.display = "none";
                container.style.display = "flex";
                container.style.opacity = "1";
                parseTTML(rawTTML);
                noLyrics.style.display = 'none';
            } else {
                container.style.display = "none";
                noLyrics.style.display = "none";
                lyricEditor.style.display = "block";
                lyricEditor.style.opacity = "1";
                ttmlInput.value = "";
            }
        } else {
            lyricEditor.style.display = "none";
            container.style.display = "flex";
            container.style.opacity = "1";
            if (rawLRC) {
                parseLRC(rawLRC);
                noLyrics.style.display = 'none';
            } else {
                container.innerHTML = '';
                noLyrics.style.display = 'block';
            }
        }
    }

    function closeEditor() {
        lyricEditor.style.display = "none";

        if (!rawTTML && rawLRC) {
            sourceSelector.value = "lrc";
            currentSource = "lrc";
            parseLRC(rawLRC);
            container.style.display = "flex";
            container.style.opacity = "1";
        } else {
            container.style.display = "flex";
            container.style.opacity = "1";
            noLyrics.style.display = "block";
        }
    }

    function openEditor() {
        console.log("Opening Editor...");

        if (rawTTML) {
            ttmlInput.value = rawTTML;
        } else {
            ttmlInput.value = "";
        }

        container.style.opacity = "0";
        noLyrics.style.opacity = "0";

        setTimeout(() => {
            container.style.display = "none";
            noLyrics.style.display = "none";

            lyricEditor.style.display = "block";
            lyricEditor.style.opacity = "0";
            setTimeout(() => lyricEditor.style.opacity = "1", 50);
        }, 400);
    }

    async function submitLyrics() {
        const ttml = ttmlInput.value.trim();
        if (!ttml) return showError("Please paste TTML content first");

        try {
            const res = await fetch(`${API_BASE}/lyrics/${videoId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ttml: ttml })
            });

            if (res.ok) {
                showError("Lyrics saved! Reloading...");
                setTimeout(() => window.location.reload(), 1500);
            } else {
                throw new Error("Failed to save lyrics");
            }
        } catch (err) {
            showError(`Submission error: ${err.message}`);
        }
    }

    function toggleLyrics() {
        userWantsLyrics = !userWantsLyrics;
        if (!userWantsLyrics) {
            setScreenVisible(false);
            video.style.opacity = "0";
            video.pause();
            return;
        }

        const allLines = Array.from(document.querySelectorAll('.lyric-line'));
        const instrumental = isInstrumentalAt(audio.currentTime, allLines);

        if (!hasLyrics && currentSource === 'ttml') {
            setScreenVisible(true);
            noLyrics.style.display = 'block';
            lyricEditor.style.display = 'block';
            return;
        }

        if (instrumental) {
            statusMsg.textContent = 'Lyrics will appear shortly';
            statusMsg.classList.add('show');
            setTimeout(() => statusMsg.classList.remove('show'), 3000);

            if (videoAvailable) {
                setScreenVisible(true);
                video.style.opacity = "1";
                video.classList.add('unfiltered');
                video.currentTime = audio.currentTime;
                if (!audio.paused) video.play().catch(() => {});
            } else {
                setScreenVisible(false);
            }
        } else {
            setScreenVisible(true);
            video.classList.remove('unfiltered');
            if (videoAvailable) {
                video.style.opacity = "1";
                video.currentTime = audio.currentTime;
                if (!audio.paused) video.play().catch(() => {});
            }
        }
    }

    function sync() {
        const time = audio.currentTime;
        if (videoAvailable && userWantsLyrics && !video.paused) {
            if (Math.abs(video.currentTime - time) > 0.3) video.currentTime = time;
        }
        const allLines = Array.from(document.querySelectorAll('.lyric-line'));
        if (allLines.length > 0 && userWantsLyrics) {
            const instrumental = isInstrumentalAt(time, allLines);
            if (instrumental) {
                container.style.opacity = '0';
                lBg.classList.remove('lyric-view-filtered');
                if (videoAvailable) {
                    setScreenVisible(true);
                    video.classList.add('unfiltered');
                } else {
                    setScreenVisible(false);
                }
            } else {
                setScreenVisible(true);
                container.style.opacity = '1';
                lBg.classList.add('lyric-view-filtered');
                if (videoAvailable) {
                    video.style.opacity = "1";
                    video.classList.remove('unfiltered');
                }
            }
            let currentIdx = -1;
            allLines.forEach((line, i) => {
                const ls = parseFloat(line.dataset.start), le = parseFloat(line.dataset.end);
                if (time >= ls && time <= le) currentIdx = i;
            });
            allLines.forEach((line, i) => {
                const dist = Math.abs(i - currentIdx);
                const opacity = currentIdx === -1 ? 0.18 : i === currentIdx ? 1 : dist === 1 ? 0.45 : dist === 2 ? 0.25 : 0.12;
                line.style.setProperty('--line-opacity', opacity);

                if (!line.classList.contains('lrc-line')) {
                    line.querySelectorAll('.word').forEach(word => {
                        const ws = parseFloat(word.dataset.start), we = parseFloat(word.dataset.end);
                        const fill = time < ws ? 0 : time > we ? 100 : ((time - ws) / (we - ws)) * 100;
                        word.style.setProperty('--fill', fill.toFixed(1));
                    });
                }
            });
            if (currentIdx >= 0 && allLines[currentIdx]) allLines[currentIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        requestAnimationFrame(sync);
    }
    init();
</script>
</body>
</html>
