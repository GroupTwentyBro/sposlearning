<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { background: #000; color: #fff; font-family: 'Google Sans', sans-serif; margin: 0; padding: 0; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 450px; gap: 30px; padding: 20px 20px 120px 20px; }

        .header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #222; }
        h1 { font-size: 22px; }

        .search-section { height: calc(100vh - 250px); display: flex; flex-direction: column; }
        .right-panel { height: calc(100vh - 250px); display: flex; flex-direction: column; }

        .tabs { display: flex; gap: 0; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background: #111; border: 1px solid #333; color: #aaa; font-weight: 600; cursor: pointer; text-align: center; border-radius: 0; }
        .tab-btn.active { background: #1a1a1a; color: #fff; border-bottom-color: transparent; }
        .tab-content { display: none; flex: 1; overflow-y: auto; padding-right: 10px; }
        .tab-content.active { display: block; }

        .search-box { display: flex; gap: 10px; background: #111; padding: 12px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; }
        input { background: none; border: none; color: #fff; flex: 1; font-size: 16px; outline: none; }

        .card { display: flex; align-items: center; gap: 15px; background: #0a0a0a; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #1a1a1a; }
        .card img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
        .info { flex: 1; min-width: 0; }
        .title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist { opacity: 0.5; font-size: 12px; margin-top: 2px; }

        .btn { background: #fff; color: #000; border: none; padding: 8px 14px; border-radius: 30px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 13px; }
        .btn:hover { background: #eee; }
        .btn-icon { background: rgba(255,255,255,0.1); color: #fff; padding: 8px; border-radius: 50%; border: none; cursor: pointer; }
        .btn-icon:hover { background: rgba(255,255,255,0.2); }
        .btn-red { background: rgba(255,59,48,0.1); color: #ff3b30; border: 1px solid #ff3b30; }
        .btn-red:hover { background: rgba(255,59,48,0.2); }
        .btn-small { padding: 5px 10px; font-size: 11px; }
        .btn-next { background: rgba(255,255,255,0.08); color: #aaa; border: 1px solid rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 30px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .btn-next:hover { background: rgba(255,255,255,0.15); color: #fff; }

        h2 { font-size: 18px; margin-bottom: 20px; opacity: 0.8; display: flex; align-items: center; gap: 10px; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .playlist-row { display: flex; justify-content: space-between; align-items: center; background: #0a0a0a; padding: 10px 14px; border-radius: 10px; margin-bottom: 6px; border: 1px solid #1a1a1a; }
        .playlist-row .name { font-weight: 600; }
        .playlist-row .count { opacity: 0.5; font-size: 12px; }
        .row-actions { display: flex; gap: 6px; }

        /* Editor */
        .editor-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .editor-header h2 { margin: 0; }

        /* Player Bar (unchanged) */
        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(20px);
            border-top: 1px solid #222;
            padding: 12px 24px;
            display: flex; align-items: center; gap: 20px;
            z-index: 1000;
        }
        .player-bar img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
        .player-info { flex: 1; min-width: 0; }
        .player-info .title { font-size: 14px; font-weight: 700; }
        .player-info .artist { font-size: 12px; opacity: 0.5; margin-top: 2px; }
        .controls { display: flex; align-items: center; gap: 16px; }
        .controls button { background: none; border: none; color: #fff; cursor: pointer; padding: 4px; }
        .progress-wrap { flex: 1; display: flex; align-items: center; gap: 10px; max-width: 400px; }
        .progress-track { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; cursor: pointer; }
        .progress-fill { height: 100%; background: #fff; border-radius: 2px; width: 0%; }
        .time-label { font-size: 11px; opacity: 0.5; min-width: 34px; }
        .volume-wrap { display: flex; align-items: center; gap: 6px; margin-left: 10px; }
        .volume-slider { width: 80px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: white; cursor: pointer; }

        .lm-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.75);
            z-index: 2000; display: flex; align-items: center; justify-content: center;
        }
        .lm-dialog {
            background: #111; border: 1px solid #333; border-radius: 16px;
            width: 90vw; max-width: 720px; display: flex; flex-direction: column;
            max-height: 85vh;
        }
        .lm-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid #222;
        }
        .lm-textarea {
            flex: 1; background: #0a0a0a; color: #fff; border: none;
            padding: 16px 20px; font-family: monospace; font-size: 12px;
            line-height: 1.6; resize: none; min-height: 340px; outline: none;
        }
        .lm-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px; border-top: 1px solid #222;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Broadcast Manager</h1>
        <button class="btn btn-red" onclick="clearPlaylist()">
            <span class="material-symbols-rounded">delete_sweep</span> Clear Radio
        </button>
    </div>

    <!-- Left Side: Search -->
    <div class="search-section">
        <h2><span class="material-symbols-rounded">search</span> Search YouTube Music</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for songs...">
            <button class="btn" onclick="performSearch()">Search</button>
        </div>
        <div class="scroll-area" id="searchResults"></div>
    </div>

    <!-- Right Side: Tabs -->
    <div class="right-panel">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('queue')">Queue</button>
            <button class="tab-btn" onclick="switchTab('playlists')">Saved Playlists</button>
        </div>

        <!-- Queue Tab -->
        <div class="tab-content active" id="tab-queue">
            <div class="section-header">
                <h2 style="margin:0"><span class="material-symbols-rounded">queue_music</span> Live Queue</h2>
                <button class="btn" onclick="saveAsPlaylist()">
                    <span class="material-symbols-rounded">save</span> Save as Playlist
                </button>
            </div>
            <div class="scroll-area" id="currentQueue">
                <p style="text-align:center; opacity:0.3; margin-top:20px;">Queue is empty</p>
            </div>
        </div>

        <!-- Playlists Tab -->
        <div class="tab-content" id="tab-playlists">
            <div class="section-header">
                <h2 style="margin:0"><span class="material-symbols-rounded">playlist_play</span> Saved Playlists</h2>
                <button class="btn btn-small" onclick="createNewPlaylist()">+ New</button>
            </div>
            <div class="scroll-area" id="savedPlaylistsList"></div>
        </div>

        <!-- Playlist Editor (hidden by default) -->
        <div class="tab-content" id="tab-editor">
            <div class="editor-header">
                <h2 id="editorTitle"></h2>
                <button class="btn btn-small" onclick="closeEditor()">Done</button>
            </div>
            <div class="scroll-area" id="editorTrackList"></div>
        </div>
    </div>
</div>

<!-- Player Bar (unchanged) -->
<div class="player-bar" id="playerBar">
    <img id="playerArt" src="">
    <div class="player-info">
        <div class="title" id="playerTitle">No track playing</div>
        <div class="artist" id="playerArtist"></div>
    </div>
    <div class="progress-wrap">
        <span class="time-label" id="timeCur">0:00</span>
        <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time-label" id="timeDur">0:00</span>
    </div>
    <div class="controls">
        <button onclick="prevTrack()"><span class="material-symbols-rounded">skip_previous</span></button>
        <button id="playPauseBtn" onclick="togglePlayPause()"><span class="material-symbols-rounded">pause</span></button>
        <button onclick="nextTrack()"><span class="material-symbols-rounded">skip_next</span></button>
    </div>
    <div class="volume-wrap">
        <span class="material-symbols-rounded" style="opacity:0.5; font-size:20px;">volume_up</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </div>
</div>

<div id="lyrics-modal" class="lm-backdrop" style="display:none;" onclick="if(event.target===this)closeLyricsModal()">
    <div class="lm-dialog">
        <div class="lm-header">
            <div>
                <div id="lm-track-title" style="font-weight:700;font-size:15px;"></div>
                <div id="lm-track-id" style="opacity:0.4;font-size:11px;margin-top:2px;"></div>
            </div>
            <button class="btn-icon" onclick="closeLyricsModal()" title="Close">
                <span class="material-symbols-rounded">close</span>
            </button>
        </div>
        <textarea id="lm-ttml" class="lm-textarea" placeholder="Paste TTML lyrics here...&#10;&#10;<tt xmlns=&quot;http://www.w3.org/ns/ttml&quot;>&#10;  ...&#10;</tt>"></textarea>
        <div class="lm-footer">
            <span id="lm-status" style="font-size:13px;opacity:0.5;"></span>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-red btn-small" onclick="clearLyrics()">Clear</button>
                <button class="btn btn-small" onclick="saveLyrics()">
                    <span class="material-symbols-rounded">save</span> Save
                </button>
            </div>
        </div>
    </div>
</div>


<audio id="audio" crossorigin="anonymous" style="display:none;"></audio>

<script>
    const API_BASE = 'https://music.sposlearning.cz';
    const KRATOS_URL = 'https://auth.sposlearning.cz';
    const BASE_URL  = 'https://sposlearning.cz';

    const container    = document.querySelector('.container');
    const playerBar    = document.getElementById('playerBar');
    const audio        = document.getElementById('audio');
    let currentTrackId = null;
    let isPlaying      = false;
    let duration       = 0;

    // Current editing context
    let editingPlaylistId = null;

    // ══════════ Admin guard ══════════
    async function guardAdmin() {
        try {
            const res = await fetch(`${KRATOS_URL}/sessions/whoami`, {
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            });
            if (!res.ok) throw new Error('Not logged in');
            const session = await res.json();
            if (session.identity?.metadata_public?.admin !== true) throw new Error('Not admin');
        } catch (err) {
            window.location.href = `${BASE_URL}/login`;
            throw err;
        }
    }

    // ── Tab switching ──
    function switchTab(tab) {
        if (editingPlaylistId && tab !== 'editor') closeEditor();
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        if (tab === 'queue') {
            document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            document.getElementById('tab-queue').classList.add('active');
            refreshQueue();
        } else if (tab === 'playlists') {
            document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
            document.getElementById('tab-playlists').classList.add('active');
            loadSavedPlaylists();
        } else if (tab === 'editor') {
            // keep queue tab highlighted? we'll show editor separately
            document.getElementById('tab-editor').classList.add('active');
        }
    }

    // ── Playback Controls (unchanged) ──
    function formatTime(s) {
        if (!isFinite(s) || isNaN(s)) return '0:00';
        return Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0');
    }

    async function updatePlayerState() {
        try {
            const res = await fetch(`${API_BASE}/radio/state`);
            const state = await res.json();
            if (!state.active) {
                document.getElementById('playerTitle').textContent = 'No track playing';
                document.getElementById('playerArtist').textContent = '';
                document.getElementById('playerArt').src = '';
                audio.pause();
                return;
            }

            if (currentTrackId !== state.current.videoId) {
                currentTrackId = state.current.videoId;
                duration = state.current.duration || 0;
                document.getElementById('playerTitle').textContent = state.current.title;
                document.getElementById('playerArtist').textContent = state.current.artist;
                document.getElementById('playerArt').src = state.current.thumbnail;
                document.getElementById('timeDur').textContent = formatTime(duration);

                audio.src = `${API_BASE}/stream/${state.current.videoId}`;
                audio.load();
                audio.addEventListener('loadedmetadata', function handler() {
                    audio.removeEventListener('loadedmetadata', handler);
                    audio.currentTime = state.offset;
                    if (isPlaying) audio.play();
                });
            } else {
                if (Math.abs(audio.currentTime - state.offset) > 2.5) {
                    audio.currentTime = state.offset;
                }
            }
        } catch (err) {
            console.error('State fetch error:', err);
        }
    }

    function updateProgress() {
        const time = audio.currentTime;
        const fill = duration ? (time / duration) * 100 : 0;
        document.getElementById('progressFill').style.width = fill + '%';
        document.getElementById('timeCur').textContent = formatTime(time);
    }

    document.getElementById('progressTrack').addEventListener('click', function(e) {
        if (!duration) return;
        const rect = this.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const ratio = x / rect.width;
        audio.currentTime = ratio * duration;
    });

    document.getElementById('volumeSlider').addEventListener('input', e => {
        audio.volume = e.target.value;
    });

    function togglePlayPause() {
        if (!currentTrackId) return;
        if (audio.paused) {
            audio.play();
            isPlaying = true;
            document.getElementById('playPauseBtn').innerHTML = '<span class="material-symbols-rounded">pause</span>';
        } else {
            audio.pause();
            isPlaying = false;
            document.getElementById('playPauseBtn').innerHTML = '<span class="material-symbols-rounded">play_arrow</span>';
        }
    }

    async function nextTrack() {
        try {
            await fetch(`${API_BASE}/radio/skip/next`, { method: 'POST' });
            updatePlayerState();
            refreshQueue();
        } catch (e) {}
    }

    async function prevTrack() {
        try {
            await fetch(`${API_BASE}/radio/skip/previous`, { method: 'POST' });
            updatePlayerState();
            refreshQueue();
        } catch (e) {}
    }

    setInterval(updateProgress, 500);
    setInterval(updatePlayerState, 3000);
    updatePlayerState();

    // ══════════ DRAG & DROP (for both queue and editor) ══════════
    let draggedItem = null;

    function attachDragListeners(card) {
        card.setAttribute('draggable', 'true');
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragover', handleDragOver);
        card.addEventListener('dragend', handleDragEnd);
        card.addEventListener('drop', handleDrop);
    }

    function handleDragStart(e) {
        draggedItem = this;
        this.style.opacity = '0.4';
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', this.dataset.id);
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }

    function handleDragEnd(e) {
        this.style.opacity = '1';
        document.querySelectorAll('.card[draggable]').forEach(c => c.style.opacity = '1');
    }

    function handleDrop(e) {
        e.preventDefault();
        const target = e.currentTarget;
        if (draggedItem && target !== draggedItem) {
            const parent = target.parentNode;
            const cards = [...parent.querySelectorAll('.card')];
            const fromIndex = cards.indexOf(draggedItem);
            const toIndex = cards.indexOf(target);

            if (fromIndex < toIndex) {
                parent.insertBefore(draggedItem, target.nextSibling);
            } else {
                parent.insertBefore(draggedItem, target);
            }

            // Update numbers if queue
            if (parent.id === 'currentQueue') {
                updateQueueNumbers();
                saveQueueOrder();
            } else if (parent.id === 'editorTrackList') {
                updateEditorNumbers();
                saveEditorOrder();
            }
        }
    }

    // ── Queue drag helpers ──
    function updateQueueNumbers() {
        const cards = document.querySelectorAll('#currentQueue .card');
        cards.forEach((card, i) => {
            const numSpan = card.querySelector('div[style*="font-size:10px"]');
            if (numSpan) numSpan.textContent = i + 1;
        });
    }

    async function saveQueueOrder() {
        const order = [...document.querySelectorAll('#currentQueue .card')].map(c => c.dataset.id);
        try {
            await fetch(`${API_BASE}/playlist/reorder`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order })
            });
        } catch (e) { refreshQueue(); }
    }

    // ── Editor drag helpers ──
    function updateEditorNumbers() {
        const cards = document.querySelectorAll('#editorTrackList .card');
        cards.forEach((card, i) => {
            const numSpan = card.querySelector('div[style*="font-size:10px"]');
            if (numSpan) numSpan.textContent = i + 1;
        });
    }

    async function saveEditorOrder() {
        const order = [...document.querySelectorAll('#editorTrackList .card')].map(c => c.dataset.videoId);
        try {
            await fetch(`${API_BASE}/playlist/${editingPlaylistId}/reorder`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order })
            });
        } catch (e) { loadEditor(); }
    }

    // ── Queue management (unchanged) ──
    async function refreshQueue() {
        try {
            const res = await fetch(`${API_BASE}/playlist`);
            const queue = await res.json();
            const queueDiv = document.getElementById('currentQueue');
            queueDiv.innerHTML = '';

            if (queue.length === 0) {
                queueDiv.innerHTML = '<p style="text-align:center; opacity:0.3; margin-top:20px;">Queue is empty</p>';
                return;
            }

            queue.forEach((t, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.id = t._id;
                card.innerHTML = `
                    <div style="font-size:10px; opacity:0.3; width:15px;">${index + 1}</div>
                    <img src="${t.thumbnail}">
                    <div class="info">
                        <div class="title">${t.title}</div>
                        <div class="artist">${t.artist}</div>
                        <div style="font-size:10px; opacity:0.25; margin-top:2px;">${t.videoId}</div>
                    </div>
                    <button class="btn-icon btn-red" onclick="removeFromQueue('${t._id}')" title="Remove">
                        <span class="material-symbols-rounded" style="font-size:18px;">delete</span>
                    </button>
                    <button class="btn-icon" onclick="openLyricsEditor('${t.videoId}', \`${t.title}\`)" title="Edit lyrics">
                        <span class="material-symbols-rounded" style="font-size:18px;">lyrics</span>
                    </button>
                `;
                attachDragListeners(card);
                queueDiv.appendChild(card);
            });
        } catch (err) { console.error("Failed to fetch queue"); }
    }

    async function performSearch() {
        const query = document.getElementById('searchInput').value;
        if (!query) return;

        const resultsDiv = document.getElementById('searchResults');
        resultsDiv.innerHTML = '<p style="text-align:center; opacity:0.5;">Searching...</p>';

        try {
            const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
            const tracks = await res.json();
            resultsDiv.innerHTML = '';

            tracks.forEach(t => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${t.thumbnail}">
                    <div class="info">
                        <div class="title">${t.title}</div>
                        <div class="artist">${t.artist}</div>
                        <div style="font-size:10px; opacity:0.25; margin-top:2px;">${t.videoId}</div>
                    </div>
                    <button class="btn" onclick='addToRadio(${JSON.stringify(t).replace(/'/g, "&apos;")})'>
                        <span class="material-symbols-rounded">add</span> Add
                    </button>
                    <button class="btn-next" onclick='addToRadioNext(${JSON.stringify(t).replace(/'/g, "&apos;")})' title="Play Next">
                        <span class="material-symbols-rounded" style="font-size:18px;">skip_next</span>
                    </button>
                    ${editingPlaylistId ? `<button class="btn-next" onclick='addToPlaylist(${JSON.stringify(t).replace(/'/g, "&apos;")})' title="Add to playlist"><span class="material-symbols-rounded" style="font-size:18px;">playlist_add</span></button>` : ''}
                `;
                resultsDiv.appendChild(card);
            });
        } catch (err) {
            resultsDiv.innerHTML = '<p style="color:#ff3b30">Search failed.</p>';
        }
    }

    async function addToRadio(track) {
        try {
            const res = await fetch(`${API_BASE}/playlist/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(track)
            });
            if (res.ok) refreshQueue();
        } catch (err) { alert("Failed to add track."); }
    }

    async function addToRadioNext(track) {
        try {
            const res = await fetch(`${API_BASE}/playlist/add/next`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(track)
            });
            if (res.ok) refreshQueue();
        } catch (err) { alert("Failed to add track next."); }
    }

    async function removeFromQueue(id) {
        try {
            const res = await fetch(`${API_BASE}/playlist/remove/${id}`, { method: 'POST' });
            if (res.ok) refreshQueue();
        } catch (err) { alert("Failed to remove track."); }
    }

    async function clearPlaylist() {
        if (!confirm("Stop radio and clear all songs?")) return;
        await fetch(`${API_BASE}/playlist/clear`, { method: 'POST' });
        refreshQueue();
    }

    // ── Saved Playlists ──
    async function loadSavedPlaylists() {
        const container = document.getElementById('savedPlaylistsList');
        try {
            const res = await fetch(`${API_BASE}/playlists`);
            const playlists = await res.json();
            if (playlists.length === 0) {
                container.innerHTML = '<p style="text-align:center; opacity:0.3; margin-top:20px;">No saved playlists</p>';
                return;
            }
            container.innerHTML = playlists.map(p => `
                <div class="playlist-row">
                    <div>
                        <div class="name">${p.name}</div>
                        <div class="count">${p.trackCount} tracks</div>
                    </div>
                    <div class="row-actions">
                        <button class="btn btn-small" onclick="loadPlaylist('${p._id}')">Load</button>
                        <button class="btn-icon" onclick="openEditor('${p._id}')" title="Edit"><span class="material-symbols-rounded" style="font-size:18px;">edit</span></button>
                        <button class="btn-icon" onclick="renamePlaylist('${p._id}')" title="Rename"><span class="material-symbols-rounded" style="font-size:18px;">drive_file_rename_outline</span></button>
                        <button class="btn-icon btn-red" onclick="deletePlaylist('${p._id}')" title="Delete"><span class="material-symbols-rounded" style="font-size:18px;">delete</span></button>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            container.innerHTML = '<p style="color:#ff3b30">Failed to load playlists</p>';
        }
    }

    async function createNewPlaylist() {
        const name = prompt('New playlist name:');
        if (!name) return;
        try {
            const res = await fetch(`${API_BASE}/playlist/create`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            if (res.ok) {
                const data = await res.json();
                openEditor(data._id);
            } else {
                alert('Failed to create playlist');
            }
        } catch (err) { alert("Create failed"); }
    }

    async function openEditor(playlistId) {
        editingPlaylistId = playlistId;
        // Show editor tab, hide others
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-editor').classList.add('active');
        await loadEditor();
        // Refresh search results so they show "Add to playlist" button
        performSearch();
    }

    async function loadEditor() {
        if (!editingPlaylistId) return;
        const res = await fetch(`${API_BASE}/playlist/${editingPlaylistId}`);
        // Actually we don't have endpoint to get a single playlist; we can fetch all playlists and find by id.
        // Simpler: add GET /playlist/:id endpoint. Let's add it quickly.
        // For now we'll fetch all and filter. But better to add an endpoint.
        const playlistsRes = await fetch(`${API_BASE}/playlists`);
        const playlists = await playlistsRes.json();
        const playlist = playlists.find(p => p._id === editingPlaylistId);
        if (!playlist) return closeEditor();

        document.getElementById('editorTitle').textContent = 'Editing: ' + playlist.name;
        const trackDiv = document.getElementById('editorTrackList');
        trackDiv.innerHTML = '';

        // Fetch full playlist details (tracks) – we need endpoint GET /playlist/:id
        // We'll add that endpoint in server: GET /playlist/:id returning full object.
        // Placeholder: fetch full playlist.
        const fullRes = await fetch(`${API_BASE}/playlist/${editingPlaylistId}/full`); // we'll create this
        const full = await fullRes.json();
        if (!full.tracks || full.tracks.length === 0) {
            trackDiv.innerHTML = '<p style="text-align:center; opacity:0.3; margin-top:20px;">Empty playlist</p>';
            return;
        }

        full.tracks.forEach((t, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.videoId = t.videoId;
            card.innerHTML = `
                <div style="font-size:10px; opacity:0.3; width:15px;">${index + 1}</div>
                <img src="${t.thumbnail}">
                <div class="info">
                    <div class="title">${t.title}</div>
                    <div class="artist">${t.artist}</div>
                    <div style="font-size:10px; opacity:0.25; margin-top:2px;">${t.videoId}</div>
                </div>
                <button class="btn-icon btn-red" onclick="removeFromPlaylist('${t.videoId}')" title="Remove">
                    <span class="material-symbols-rounded" style="font-size:18px;">delete</span>
                </button>
                <button class="btn-icon" onclick="openLyricsEditor('${t.videoId}', \`${t.title}\`)" title="Edit lyrics">
                    <span class="material-symbols-rounded" style="font-size:18px;">lyrics</span>
                </button>
            `;
            attachDragListeners(card);
            trackDiv.appendChild(card);
        });
    }

    async function addToPlaylist(track) {
        if (!editingPlaylistId) return;
        try {
            const res = await fetch(`${API_BASE}/playlist/${editingPlaylistId}/track`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(track)
            });
            if (res.ok) loadEditor();
        } catch (err) { alert("Failed to add track to playlist."); }
    }

    async function removeFromPlaylist(videoId) {
        if (!editingPlaylistId) return;
        try {
            const res = await fetch(`${API_BASE}/playlist/${editingPlaylistId}/track/${videoId}`, { method: 'DELETE' });
            if (res.ok) loadEditor();
        } catch (err) { alert("Failed to remove track."); }
    }

    function closeEditor() {
        editingPlaylistId = null;
        switchTab('playlists');
    }

    async function saveAsPlaylist() {
        const name = prompt('Playlist name:');
        if (!name) return;
        try {
            const res = await fetch(`${API_BASE}/playlist/save`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            if (res.ok) {
                alert('Playlist saved!');
                switchTab('playlists');
            } else {
                alert('Failed to save playlist');
            }
        } catch (err) { alert("Save failed"); }
    }

    async function loadPlaylist(id) {
        if (!confirm("Load this playlist? The current queue will be replaced.")) return;
        try {
            const res = await fetch(`${API_BASE}/playlist/load/${id}`, { method: 'POST' });
            if (res.ok) {
                refreshQueue();
                switchTab('queue');
            } else {
                alert('Failed to load playlist');
            }
        } catch (err) { alert("Load failed"); }
    }

    async function deletePlaylist(id) {
        if (!confirm("Delete this playlist permanently?")) return;
        try {
            await fetch(`${API_BASE}/playlist/${id}`, { method: 'DELETE' });
            loadSavedPlaylists();
        } catch (err) { alert("Delete failed"); }
    }

    async function renamePlaylist(id) {
        const newName = prompt('New name:');
        if (!newName) return;
        try {
            await fetch(`${API_BASE}/playlist/${id}/name`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName })
            });
            loadSavedPlaylists();
        } catch (err) { alert("Rename failed"); }
    }

    let lyricsVideoId = null;

    async function openLyricsEditor(videoId, title) {
        lyricsVideoId = videoId;
        document.getElementById('lm-track-title').textContent = title;
        document.getElementById('lm-track-id').textContent = videoId;
        document.getElementById('lm-status').textContent = 'Loading...';
        document.getElementById('lm-ttml').value = '';
        document.getElementById('lyrics-modal').style.display = 'flex';

        try {
            const res = await fetch(`${API_BASE}/lyrics/${videoId}`);
            if (res.ok) {
                const text = await res.text();
                document.getElementById('lm-ttml').value = text;
                document.getElementById('lm-status').textContent = 'Lyrics loaded';
            } else {
                document.getElementById('lm-status').textContent = 'No lyrics yet';
            }
        } catch (e) {
            document.getElementById('lm-status').textContent = 'Could not fetch lyrics';
        }
    }

    function closeLyricsModal() {
        document.getElementById('lyrics-modal').style.display = 'none';
        lyricsVideoId = null;
    }

    async function saveLyrics() {
        if (!lyricsVideoId) return;
        const ttml = document.getElementById('lm-ttml').value.trim();
        document.getElementById('lm-status').textContent = 'Saving...';
        try {
            const res = await fetch(`${API_BASE}/lyrics/${lyricsVideoId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ttml })
            });
            if (res.ok) {
                document.getElementById('lm-status').textContent = '✓ Saved';
                setTimeout(() => {
                    document.getElementById('lm-status').textContent = '';
                }, 2500);
            } else {
                document.getElementById('lm-status').textContent = 'Save failed';
            }
        } catch (e) {
            document.getElementById('lm-status').textContent = 'Save failed';
        }
    }

    async function clearLyrics() {
        if (!confirm('Remove lyrics for this track?')) return;
        document.getElementById('lm-ttml').value = '';
        await saveLyrics();
    }

    document.getElementById('searchInput').onkeydown = e => { if(e.key === 'Enter') performSearch(); };

    guardAdmin().then(() => {
        refreshQueue();
        loadSavedPlaylists();
    }).catch(() => {});
</script>
</body>
</html>
