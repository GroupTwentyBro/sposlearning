<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' https://*.googleapis.com https://*.gstatic.com;
    script-src 'self' 'unsafe-inline' https://*.gstatic.com https://cdn.jsdelivr.net https://stackpath.bootstrapcdn.com https://cdnjs.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://stackpath.bootstrapcdn.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: https://*.googleusercontent.com https://res.cloudinary.com;
    connect-src 'self' https://*.googleapis.com https://api.ipify.org https://api.cloudinary.com https://*.sposlearning.cz;
    ">
    <title>Send Feedback - SPOŠLearning</title>

    <link rel="icon" type="image/x-icon" href="/media/logo.svg">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link id="theme-link" href="/style/theme-dark.css" rel="stylesheet">
    <link href="/style/variables-global.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/base.css">
    <link rel="stylesheet" href="/style/forms.css">
    <link rel="stylesheet" href="/style/custom-el.css">
    <link rel="stylesheet" href="/style/mobile.css">

    <script src="/js/theming.js" type="module"></script>

    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

<div class="mainpage">
    <h1>Zpětná vazba</h1>
    <p>Našel jsi chybu nebo chceš něco vylepšit? Dej nám vědět.</p>
    <hr>

    <div id="feedback-form-wrapper" style="display: none;">
        <form id="feedback-form">
            <div class="form-group">
                <label for="feedback-title">Název</label>
                <input type="text" class="form-control" id="feedback-title" placeholder="Chyba v tématu X" required>
            </div>

            <div class="form-group">
                <label for="feedback-category">Kategorie</label>
                <select class="form-select form-control" id="feedback-category" required>
                    <option value="articles">Zápisy</option>
                    <option value="bug">Chyba webu</option>
                    <option value="idea">Nápad</option>
                    <option value="other">Ostatní</option>
                </select>
            </div>

            <div class="form-group" id="feedback-page-group">
                <label for="feedback-page">Stránka</label>
                <input type="text" class="form-control" id="feedback-page" placeholder="/mat/mnoziny">
            </div>

            <div class="form-group">
                <label for="feedback-message">Zpráva</label>
                <textarea class="form-control" id="feedback-message" rows="5" required placeholder="Popište vaši zpětnou vazbu..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="submit-btn">Odeslat zpětnou vazbu</button>
        </form>
    </div>

    <div id="status-message" class="mt-3"></div>
</div>

<script type="module" src="/js/feedback.js"></script>
<script src="/js/notice.js"></script>
</body>
</html>
