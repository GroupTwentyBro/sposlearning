<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nastavení - SPOŠLearning</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/media/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link id="theme-link" href="/style/theme-dark.css" rel="stylesheet">
    <link href="/style/variables-global.css" rel="stylesheet">
    <link href="style/base.css" rel="stylesheet">
    <link href="style/components.css" rel="stylesheet">
    <link href="style/search.css" rel="stylesheet">
    <link href="style/custom-el.css" rel="stylesheet">
    <link href="style/mobile.css" rel="stylesheet">

    <script src="/js/theming.js" type="module"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
<div class="container-fluid py-4">
    <div class="d-flex align-items-start">
        <div class="nav flex-column nav-pills me-5" id="v-pills-tab" role="tablist" aria-orientation="vertical" style="min-width: 250px;">
            <h4 class="mb-4 px-3">Settings</h4>
            <button class="nav-link active text-start d-flex align-items-center mb-2" id="v-pills-general-tab" data-bs-toggle="pill" data-bs-target="#v-pills-general" type="button" role="tab">
                <span class="material-symbols-outlined me-2">settings</span> General
            </button>

            <button class="nav-link text-start d-flex align-items-center mb-2" id="v-pills-account-tab" data-bs-toggle="pill" data-bs-target="#v-pills-account" type="button" role="tab">
                <span class="material-symbols-outlined me-2">person</span> Account
            </button>
        </div>

        <div class="tab-content flex-grow-1 bg-transparent border-0 p-4" id="v-pills-tabContent">

            <div class="tab-pane fade show active box" id="v-pills-general" role="tabpanel">
                <h3 class="mb-4">General Settings</h3>
                <div class="row align-items-center box">
                    <div class="col-md-6">
                        <label class="h5">Theme</label>
                        <p class="small">Select your preferred interface color scheme.</p>
                    </div>
                    <div class="col-md-6">
                        <select class="form-select" aria-label="Theme picker">
                            <option value="dark" selected>Dark Theme</option>
                            <option value="light">Light Theme</option>
                            <option value="color">Color Theme</option>
                            <option value="miku">Miku Theme</option>
                            <option value="teddy">Teddy Theme</option>
                            <option value="mike">Mike Theme</option>
                        </select>
                        <input type="range" id="hueSlider" min="0" max="360" value="0" class="form-range" style="margin: 10px; display: none;">
                        <span id="hue-value-display" class="ms-2 badge bg-dark" style="display: none;">0°</span>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade box" id="v-pills-account" role="tabpanel">
                <h3 class="mb-4 text-white">Account Settings</h3>

                <div class="row align-items-center box p-3">
                    <div class="col-md-6">
                        <label class="h5">Name</label>
                        <p class="small">Set your display name.</p>
                    </div>
                    <div class="col-md-6 text-end">
                        <span id="display-name-text" class="fw-bold"></span>
                        <button class="btn btn-sm btn-outline-secondary ms-2" onclick="toggleNameEdit()">Edit</button>
                    </div>
                </div>

                <div class="row align-items-center box p-3">
                    <div class="col-md-6">
                        <label class="h5">Email address</label>
                        <div id="email-verification-status" class="small mt-1"></div>
                    </div>
                    <div class="col-md-6">
                        <input type="email" id="account-email" class="form-control mb-2" readonly>
                        <div id="resend-container" class="text-end"></div>
                    </div>
                </div>

                <div class="row align-items-center box p-3">
                    <div class="col-md-6">
                        <label class="h5">Password</label>
                        <p class="small">Receive a secure link to change your password.</p>
                    </div>
                    <div class="col-md-6 text-end">
                        <button id="btn-reset-pw" class="btn btn-outline-primary w-100">Send password reset email</button>
                    </div>
                </div>

                <div class="row align-items-center box p-3">
                    <div class="col-md-6">
                        <label class="h5">Linked providers</label>
                        <p class="small">Authentication methods linked to your account.</p>
                    </div>
                    <div class="col-md-6">
                        <div id="provider-list" class="d-flex justify-content-end gap-3">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/settings.js" type="module"></script>
</body>
</html>
