<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nastavení - SPOŠLearning</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://*.gstatic.com https://cdn.jsdelivr.net;"><title>SPOŠLearning</title>

    <link rel="icon" type="image/x-icon" href="/media/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link id="theme-link" href="/style/theme-dark.css" rel="stylesheet">
    <link href="/style/variables-global.css" rel="stylesheet">
    <link href="style/base.css" rel="stylesheet">
    <link href="style/components.css" rel="stylesheet">
    <link href="style/search.css" rel="stylesheet">
    <link href="style/custom-el.css" rel="stylesheet">
    <link href="style/mobile.css" rel="stylesheet">

    <script src="/js/theming.js" type="module"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
<div class="container-fluid py-4">
    <div class="d-flex align-items-start">
        <div class="nav flex-column nav-pills me-5" id="v-pills-tab" role="tablist" aria-orientation="vertical" style="min-width: 250px;">
            <h4 class="mb-4 px-3">Settings</h4>

            <button class="nav-link active text-start d-flex align-items-center mb-2" id="v-pills-general-tab" data-bs-toggle="pill" data-bs-target="#v-pills-general" type="button" role="tab">
                <span class="material-symbols-outlined me-2">settings</span> General
            </button>

            <button class="nav-link text-start d-flex align-items-center mb-2" id="v-pills-account-tab" data-bs-toggle="pill" data-bs-target="#v-pills-account" type="button" role="tab">
                <span class="material-symbols-outlined me-2">person</span> Account
            </button>
        </div>

        <div class="tab-content flex-grow-1 bg-transparent border-0 p-4" id="v-pills-tabContent">

            <div class="tab-pane fade show active box" id="v-pills-general" role="tabpanel">
                <h3 class="mb-4">General Settings</h3>
                <div class="row align-items-center box">
                    <div class="col-md-6">
                        <label class="h5">Theme</label>
                        <p class="small">Select your preferred interface color scheme.</p>
                    </div>
                    <div class="col-md-6">
                        <select class="form-select border-primary" aria-label="Theme picker">
                            <option value="dark" selected>Dark Theme</option>
                            <option value="light">Light Theme</option>
                            <option value="color">Color Theme</option>
                            <option value="miku">Miku Theme</option>
                            <option value="teddy">Teddy Theme</option>
                            <option value="mike">Mike Theme</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="v-pills-account" role="tabpanel">
                <h3 class="mb-4">Account Settings</h3>
                <p>Manage your profile and security settings here.</p>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
