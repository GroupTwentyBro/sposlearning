<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            min-height: 100%; background: #000; color: white;
            font-family: "Google Sans", sans-serif;
            overflow-x: hidden;
        }

        .bg-blur {
            position: fixed; inset: -35%;
            background-size: cover; background-position: center;
            filter: blur(80px) brightness(0.25) saturate(1.4);
            transform: scale(1.15); z-index: 0;
            transition: background-image 1.5s ease;
            background-repeat: no-repeat;
            pointer-events: none;
        }

        .page {
            position: relative; z-index: 1;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center;
            padding: 60px 24px 80px;
        }

        /* ── Search bar ── */
        .search-wrap {
            width: 100%; max-width: 620px;
            display: flex; flex-direction: column; align-items: center;
            gap: 32px; margin-bottom: 48px;
        }

        .search-title {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 700; opacity: 0.9; letter-spacing: -0.5px;
        }

        .search-bar {
            width: 100%; display: flex; align-items: center;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50px;
            padding: 0 8px 0 22px;
            transition: background 0.2s, border-color 0.2s;
            backdrop-filter: blur(12px);
        }
        .search-bar:focus-within {
            background: rgba(255,255,255,0.13);
            border-color: rgba(255,255,255,0.3);
        }

        .search-bar input {
            flex: 1; background: none; border: none; outline: none;
            color: white; font-family: inherit; font-size: 16px;
            padding: 16px 0; min-width: 0;
        }
        .search-bar input::placeholder { color: rgba(255,255,255,0.35); }

        .search-bar button {
            background: rgba(255,255,255,0.15); border: none; color: white;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: background 0.2s;
        }
        .search-bar button:hover { background: rgba(255,255,255,0.25); }
        .search-bar button .material-symbols-rounded { font-size: 20px; }

        /* ── Results ── */
        .results {
            width: 100%; max-width: 720px;
            display: flex; flex-direction: column; gap: 4px;
        }

        .result-item {
            display: flex; align-items: center; gap: 16px;
            padding: 10px 12px; border-radius: 12px;
            cursor: pointer; text-decoration: none; color: white;
            transition: background 0.15s;
            animation: fadeSlideIn 0.3s ease both;
        }
        .result-item:hover { background: rgba(255,255,255,0.08); }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .result-thumb {
            width: 56px; height: 56px; border-radius: 8px;
            background: rgba(255,255,255,0.06) center/cover no-repeat;
            flex-shrink: 0;
        }

        .result-info { flex: 1; min-width: 0; }
        .result-title {
            font-size: 15px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .result-sub {
            font-size: 13px; opacity: 0.5; margin-top: 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .result-duration {
            font-size: 13px; opacity: 0.4;
            font-variant-numeric: tabular-nums; flex-shrink: 0;
        }

        /* ── States ── */
        .state-msg {
            opacity: 0.35; font-size: 15px; margin-top: 40px; text-align: center;
        }

        .spinner {
            width: 28px; height: 28px;
            border: 2px solid rgba(255,255,255,0.15);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 48px auto 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #error-msg {
            color: rgba(255,100,100,0.8); font-size: 14px;
            margin-top: 32px; text-align: center; display: none;
        }
    </style>
</head>
<body>

<div class="bg-blur" id="bg"></div>

<div class="page">
    <div class="search-wrap">
        <span class="search-title">Search</span>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Songs, artists, albums…" autocomplete="off" spellcheck="false">
            <button id="search-btn">
                <span class="material-symbols-rounded">search</span>
            </button>
        </div>
    </div>

    <div class="results" id="results"></div>
    <div class="spinner" id="spinner" style="display:none"></div>
    <div class="state-msg" id="state-msg">Start typing to search YouTube Music</div>
    <div id="error-msg"></div>
</div>

<canvas id="colorThief" style="display:none"></canvas>

<script>
    const API_BASE = 'https://music.sposlearning.cz';
    const input    = document.getElementById('search-input');
    const btn      = document.getElementById('search-btn');
    const results  = document.getElementById('results');
    const spinner  = document.getElementById('spinner');
    const stateMsg = document.getElementById('state-msg');
    const errorMsg = document.getElementById('error-msg');
    const bg       = document.getElementById('bg');

    let debounceTimer = null;

    function formatTime(s) {
        if (!s || !isFinite(s)) return '';
        return Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0');
    }

    function extractColor(imgEl) {
        const canvas = document.getElementById('colorThief');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.height = 40;
        try {
            ctx.drawImage(imgEl, 0, 0, 40, 40);
            const data = ctx.getImageData(0, 0, 40, 40).data;
            let rS = 0, gS = 0, bS = 0, n = 0;
            for (let i = 0; i < data.length; i += 4) {
                const lum = 0.2126*data[i] + 0.7152*data[i+1] + 0.0722*data[i+2];
                if (lum < 20 || lum > 230) continue;
                rS += data[i]; gS += data[i+1]; bS += data[i+2]; n++;
            }
            if (!n) return;
            document.documentElement.style.setProperty('--track-glow',
                `rgb(${Math.round(rS/n)},${Math.round(gS/n)},${Math.round(bS/n)})`);
        } catch(e) {}
    }

    function setBackground(thumbUrl) {
        bg.style.backgroundImage = `url('${thumbUrl}')`;
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => extractColor(img);
        img.src = thumbUrl;
    }

    async function doSearch(query) {
        if (!query.trim()) return;

        results.innerHTML = '';
        errorMsg.style.display = 'none';
        stateMsg.style.display = 'none';
        spinner.style.display = 'block';

        try {
            const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
            if (!res.ok) throw new Error(`Server error ${res.status}`);
            const tracks = await res.json();

            spinner.style.display = 'none';

            if (!tracks.length) {
                stateMsg.textContent = 'No results found';
                stateMsg.style.display = 'block';
                return;
            }

            // Set background to first result's thumbnail
            if (tracks[0]?.thumbnail) setBackground(tracks[0].thumbnail);

            tracks.forEach((track, i) => {
                const a = document.createElement('a');
                a.className = 'result-item';
                a.href = `../player.html?v=${track.videoId}`;
                a.style.animationDelay = `${i * 40}ms`;

                const sub = [track.artist, track.album].filter(Boolean).join(' • ');

                a.innerHTML = `
                    <div class="result-thumb" style="background-image:url('${track.thumbnail}')"></div>
                    <div class="result-info">
                        <div class="result-title">${escHtml(track.title)}</div>
                        ${sub ? `<div class="result-sub">${escHtml(sub)}</div>` : ''}
                    </div>
                    ${track.duration ? `<span class="result-duration">${formatTime(track.duration)}</span>` : ''}
                `;

                // Update bg on hover
                a.addEventListener('mouseenter', () => {
                    if (track.thumbnail) setBackground(track.thumbnail);
                });

                results.appendChild(a);
            });

        } catch (err) {
            spinner.style.display = 'none';
            errorMsg.textContent = `Search failed: ${err.message}`;
            errorMsg.style.display = 'block';
        }
    }

    function escHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    btn.addEventListener('click', () => doSearch(input.value));
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') doSearch(input.value);
    });

    // Debounced live search
    input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        if (!input.value.trim()) {
            stateMsg.textContent = 'Start typing to search YouTube Music';
            stateMsg.style.display = 'block';
            results.innerHTML = '';
            spinner.style.display = 'none';
            return;
        }
        debounceTimer = setTimeout(() => doSearch(input.value), 500);
    });

    input.focus();
</script>
</body>
</html>
