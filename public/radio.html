<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Radio • Live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --track-color: #ffffff;
            --track-glow: #ffffff;
            --lyric-blur: 20px;
            --lyric-dim: 0.65;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%; overflow: hidden;
            color: white; background: #000;
            font-family: "Google Sans", sans-serif;
        }

        /* Background Effects */
        .bg-blur {
            position: absolute;
            inset: -35%;
            background-size: cover; background-position: center;
            filter: blur(60px) brightness(0.4) saturate(1.4);
            transform: scale(1.15); z-index: 1;
            transition: background-image 1s ease;
            background-repeat: no-repeat;
        }

        .player-content {
            position: relative; z-index: 2;
            display: flex; flex-direction: row; align-items: stretch;
            height: 100vh; background: rgba(0,0,0,0.3); padding: 24px;
        }

        .cover-art {
            flex-shrink: 0; height: min(70vh, 500px); width: min(70vh, 500px);
            margin: auto 24px; border-radius: 16px;
            background-size: cover; background-position: center;
            box-shadow: 0 24px 80px rgba(0,0,0,0.85); display: block;
        }

        .main-info {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; padding: 0 16px; min-width: 0; text-align: left;
        }

        .live-badge {
            display: flex; align-items: center; gap: 8px;
            color: #ff3b30; font-weight: 800; font-size: 14px;
            letter-spacing: 1px; margin-bottom: 12px;
        }
        .live-dot { width: 10px; height: 10px; background: #ff3b30; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        h1 { font-size: clamp(22px, 2.5vw, 32px); font-weight: 700; line-height: 1.2; }
        p#meta { opacity: 0.55; margin-top: 8px; font-size: clamp(14px, 1.5vw, 18px); }

        /* Controls */
        .controls { margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
        .progress-wrap { display: flex; align-items: center; gap: 10px; }
        .time-label { font-size: 12px; opacity: 0.5; font-variant-numeric: tabular-nums; min-width: 34px; }

        .progress-track { flex: 1; height: 4px; background: rgba(255,255,255,0.18); border-radius: 2px; position: relative; cursor: default; }
        .progress-fill { height: 100%; border-radius: 2px; background: white; width: 0%; pointer-events: none; }

        .btn-row { display: flex; align-items: center; gap: 12px; }
        .volume-wrap { display: flex; align-items: center; gap: 8px; }
        .volume-slider { -webkit-appearance: none; width: 80px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: white; cursor: pointer; }

        .lyric-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 24px; border-radius: 20px; cursor: pointer; transition: background 0.2s; font-weight: 600; font-size: 14px; }
        .lyric-btn:hover { background: rgba(255,255,255,0.2); }

        /* Next Up Card */
        .next-up-card {
            position: fixed; bottom: 32px; left: 32px; z-index: 10;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(20px);
            padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 12px; width: 300px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        .next-up-card img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; }
        .next-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #lyrics-screen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; overflow-y: auto; background: #000;
            opacity: 0; pointer-events: none;
            transition: opacity 1.2s ease;
        }
        #lyrics-screen.active { opacity: 1; pointer-events: auto; }

        #lyrics-bg {
            position: fixed; inset: -35%;
            background-size: cover; background-position: center;
            background-repeat: no-repeat; z-index: -2;
            filter: blur(20px) brightness(var(--lyric-dim)) saturate(1.3);
            transition: filter 1s ease, transform 1s ease;
        }

        #lyrics-video {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; opacity: 0;
            filter: blur(5px) brightness(var(--lyric-dim)) saturate(1.3);
            transform: scale(1.08);
            transition: opacity 1s ease, filter 1s ease, transform 1s ease;
        }

        #lyrics-video.unfiltered {
            filter: none;
            transform: none;
        }

        .lyric-view-filtered {
            filter: blur(5px) brightness(var(--lyric-dim)) saturate(1.3);
            transform: scale(1.08);
        }

        #lyrics-container {
            position: relative; z-index: 2; width: 100%; max-width: 780px;
            padding: 50vh 24px; display: flex; flex-direction: column; align-items: center;
            transition: opacity 0.8s ease;
        }

        .lyric-line {
            font-size: clamp(22px, 4vw, 38px); font-weight: 800; line-height: 1.35;
            margin: 13px 0; text-align: center; width: 100%;
            opacity: var(--line-opacity, 0.18); transition: opacity 0.5s ease;
        }

        .word { display: inline-block; position: relative; color: rgba(255,255,255,0.2); transform: translateY(calc(var(--fill, 0) * (var(--fill, 0) - 100) * 0.002px)); }
        .word::before { content: attr(data-text); position: absolute; inset: 0; color: var(--track-color); clip-path: inset(0 calc((100 - var(--fill, 0)) * 1%) 0 0); white-space: nowrap; pointer-events: none; }
        .word::after {
            content: attr(data-text); position: absolute; inset: 0; color: transparent;
            text-shadow: 0 0 16px rgba(255,255,255,0.7), 0 0 35px var(--track-glow), 0 0 70px var(--track-glow), 0 0 110px var(--track-glow);
            opacity: calc(var(--fill, 0) / 100 * 0.9); white-space: nowrap; pointer-events: none; z-index: -1;
        }

        .close-lyrics { position: fixed; top: 26px; right: 28px; cursor: pointer; z-index: 103; opacity: 0.65; }
        .material-symbols-rounded { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; color: white; }
        canvas#colorThief { display: none; }

        #no-lyrics-msg {
            opacity: 0.4; font-size: 18px; font-weight: 600; text-align: center;
            margin-top: 40px; display: none;
        }

        #source-selector {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 20px;
            outline: none;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }
        #source-selector:hover { background: rgba(255,255,255,0.15); }
        #source-selector option { background: #111; color: white; }

        #sticky-lyric {
            position: fixed;
            top: 0;
            left: 0; right: 0;
            z-index: 102;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 24px 60px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(255,255,255,0.1) 50%, transparent 100%);
            pointer-events: none;
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #sticky-lyric.visible {
            opacity: 1;
            transform: translateY(0);
        }
        #sticky-lyric .lyric-line {
            margin: 0 !important;
        }

        /* Loading Overlay */
        #loading-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #loading-overlay.hidden { opacity: 0; visibility: hidden; }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 36px; height: 36px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { font-weight: 600; font-size: 14px; letter-spacing: 0.5px; }

        /* Error Banner */
        #error-banner {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 300;
            background: #ff3b30; color: white; padding: 12px 24px; border-radius: 30px;
            font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #error-banner.show { opacity: 1; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="loading-spinner"></div>
    <div id="loading-text">Tuning in...</div>
</div>

<div id="error-banner"></div>

<div class="bg-blur" id="bg"></div>
<canvas id="colorThief" style="display:none"></canvas>

<div class="player-content">
    <div class="cover-art" id="art"></div>
    <div class="main-info">
        <div class="live-badge"><div class="live-dot"></div> LIVE</div>
        <h1 id="title">Radio Station</h1>
        <p id="meta">Broadcast loading...</p>

        <div class="controls">
            <div class="progress-wrap">
                <span class="time-label" id="time-cur">0:00</span>
                <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
                <span class="time-label" id="time-dur">0:00</span>
            </div>
            <div class="btn-row">
                <div class="volume-wrap">
                    <span class="material-symbols-rounded" style="opacity:0.5; font-size: 20px;">volume_up</span>
                    <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
                <button class="lyric-btn" id="lyrics-toggle-btn" onclick="toggleLyrics()">Lyrics</button>
            </div>
        </div>
    </div>
</div>

<div class="next-up-card" id="next-card" style="opacity: 0; transform: translateY(30px);">
    <img id="next-thumb" src="">
    <div class="next-info">
        <div style="font-size: 10px; opacity: 0.5; font-weight: 800; margin-bottom: 2px;">UP NEXT</div>
        <div class="next-title" id="next-title">Next Song</div>
    </div>
</div>

<div id="lyrics-screen">
    <video id="lyrics-video" muted playsinline></video>
    <div id="lyrics-bg"></div>
    <span class="close-lyrics" onclick="toggleLyrics()">
        <span class="material-symbols-rounded" style="font-size: 36px;">close</span>
    </span>
    <div id="sticky-lyric"></div>
    <div id="lyrics-container"></div>
</div>

<audio id="audio" preload="metadata" crossorigin="anonymous"></audio>

<script>
    const API_BASE = 'https://music.sposlearning.cz';
    const audio = document.getElementById('audio');
    const video = document.getElementById('lyrics-video');
    const lyricsEl = document.getElementById('lyrics-screen');
    const container = document.getElementById('lyrics-container');
    const stickyLyric = document.getElementById('sticky-lyric');
    const loadingOverlay = document.getElementById('loading-overlay');
    const errorBanner = document.getElementById('error-banner');

    let currentTrackId = null;
    let userWantsLyrics = false;
    let videoAvailable = false;
    let totalDurationSeconds = 0;
    let hasLyrics = false;
    let stickyClone = null;

    function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.classList.add('show');
        setTimeout(() => errorBanner.classList.remove('show'), 4000);
    }

    function formatTime(s) {
        if (!isFinite(s) || isNaN(s)) return '0:00';
        return Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0');
    }

    function extractColor(img) {
        const canvas = document.getElementById('colorThief');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.height = 40;
        ctx.drawImage(img, 0, 0, 40, 40);
        const data = ctx.getImageData(0, 0, 40, 40).data;
        let rS = 0, gS = 0, bS = 0, n = 0;
        for (let i = 0; i < data.length; i += 4) {
            const lum = 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2];
            if (lum < 20 || lum > 230) continue;
            rS += data[i]; gS += data[i+1]; bS += data[i+2]; n++;
        }
        if (!n) return;
        const gr = Math.round(rS/n), gg = Math.round(gS/n), gb = Math.round(bS/n);
        const glowR = Math.min(255, Math.max(0, Math.round(128 + (gr - 128) * 2.2)));
        const glowG = Math.min(255, Math.max(0, Math.round(128 + (gg - 128) * 2.2)));
        const glowB = Math.min(255, Math.max(0, Math.round(128 + (gb - 128) * 2.2)));

        document.documentElement.style.setProperty('--track-glow', `rgb(${glowR},${glowG},${glowB})`);
        document.documentElement.style.setProperty('--track-color', `rgb(${Math.round(glowR*0.15+216)},${Math.round(glowG*0.15+216)},${Math.round(glowB*0.15+216)})`);
    }

    async function updateBroadcast() {
        try {
            const res = await fetch(`${API_BASE}/radio/state`);
            const state = await res.json();
            if (!state.active) {
                document.getElementById('loading-text').textContent = "Radio Offline";
                return;
            }

            if (currentTrackId !== state.current.videoId) {
                currentTrackId = state.current.videoId;
                hasLyrics = false;
                stickyClone = null;
                stickyLyric.classList.remove('visible');

                document.getElementById('title').textContent = state.current.title;
                document.getElementById('meta').textContent = state.current.artist;
                const thumb = state.current.thumbnail;
                document.getElementById('bg').style.backgroundImage = `url(${thumb})`;
                document.getElementById('art').style.backgroundImage = `url(${thumb})`;
                document.getElementById('lyrics-bg').style.backgroundImage = `url(${thumb})`;

                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => extractColor(img);
                img.src = thumb;

                audio.src = `${API_BASE}/stream/${currentTrackId}`;
                totalDurationSeconds = state.current.duration;
                document.getElementById('time-dur').textContent = formatTime(totalDurationSeconds);

                // Wait until audio metadata is loaded before setting currentTime & playing
                audio.addEventListener('loadedmetadata', function handler() {
                    audio.removeEventListener('loadedmetadata', handler);
                    audio.currentTime = state.offset;
                    audio.play().catch(() => {
                        document.getElementById('loading-text').textContent = "Click to Join Broadcast";
                        window.onclick = () => { audio.play(); window.onclick = null; loadingOverlay.classList.add('hidden'); };
                    });
                });

                try {
                    const lRes = await fetch(`${API_BASE}/lyrics/${currentTrackId}`);
                    if (lRes.ok) {
                        const ttml = await lRes.text();
                        parseTTML(ttml);
                        hasLyrics = true;
                    } else {
                        container.innerHTML = '<div style="opacity:0.3; font-size: 24px; font-weight: 700; margin-top: 20px;">Instrumental</div>';
                    }
                } catch(e) { container.innerHTML = ''; }

                videoAvailable = false;
                video.style.opacity = "0";
                const vUrl = `${API_BASE}/video/${currentTrackId}`;
                fetch(vUrl, { method: 'HEAD' }).then(vCheck => {
                    if (vCheck.ok) {
                        video.src = vUrl;
                        videoAvailable = true;
                        if (userWantsLyrics && !audio.paused) video.play();
                    }
                });
            } else {
                // Syncing offset for already playing track
                if (Math.abs(audio.currentTime - state.offset) > 2.5) {
                    audio.currentTime = state.offset;
                    if (videoAvailable) video.currentTime = state.offset;
                }
                if (audio.paused) {
                    audio.play().catch(() => {});
                } else {
                    loadingOverlay.classList.add('hidden');
                }
            }

            if (state.next) {
                document.getElementById('next-card').style.opacity = "1";
                document.getElementById('next-card').style.transform = "translateY(0)";
                document.getElementById('next-thumb').src = state.next.thumbnail;
                document.getElementById('next-title').textContent = state.next.title;
            }

        } catch (err) { console.error("Broadcast Error:", err); }
    }

    function parseTTML(ttml) {
        container.innerHTML = '';
        const xml = new DOMParser().parseFromString(ttml, 'text/xml');
        for (const p of xml.getElementsByTagName('p')) {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'lyric-line';
            let sTime = Infinity, eTime = -Infinity;

            Array.from(p.childNodes).forEach(node => {
                if (node.nodeType === 1 && node.tagName.toLowerCase() === 'span') {
                    const start = parseT(node.getAttribute('begin')), end = parseT(node.getAttribute('end'));
                    sTime = Math.min(sTime, start); eTime = Math.max(eTime, end);

                    const word = document.createElement('span');
                    word.className = 'word';
                    word.textContent = node.textContent;
                    word.dataset.text = node.textContent;
                    word.dataset.start = start;
                    word.dataset.end = end;
                    lineDiv.appendChild(word);
                } else if (node.nodeType === 3) {
                    lineDiv.appendChild(document.createTextNode(node.textContent));
                }
            });
            lineDiv.dataset.start = sTime; lineDiv.dataset.end = eTime;
            container.appendChild(lineDiv);
        }
    }

    function parseT(t) {
        if (!t) return 0;
        const parts = t.split(':').map(parseFloat);
        return parts.length === 3 ? (parts[0]*3600)+(parts[1]*60)+parts[2] : (parts[0]*60)+parts[1];
    }

    function toggleLyrics() {
        userWantsLyrics = !userWantsLyrics;
        lyricsEl.classList.toggle('active', userWantsLyrics);
        if (userWantsLyrics && videoAvailable) {
            video.currentTime = audio.currentTime;
            video.play();
            video.style.opacity = "1";
        } else {
            video.pause();
            video.style.opacity = "0";
            stickyLyric.classList.remove('visible');
        }
    }

    function sync() {
        const time = audio.currentTime;
        const duration = totalDurationSeconds || audio.duration;

        if (duration) {
            document.getElementById('progress-fill').style.width = (time / duration * 100) + '%';
            document.getElementById('time-cur').textContent = formatTime(time);
        }

        if (userWantsLyrics) {
            const allLines = Array.from(document.querySelectorAll('.lyric-line'));
            let currentIdx = -1, stickyIdx = -1;

            allLines.forEach((line, i) => {
                const s = parseFloat(line.dataset.start), e = parseFloat(line.dataset.end);
                if (time >= s && time <= e) currentIdx = i;
                if (time >= s) stickyIdx = i;

                const dist = Math.abs(i - currentIdx);
                const opacity = currentIdx === -1 ? 0.18 : i === currentIdx ? 1 : dist === 1 ? 0.45 : 0.15;
                line.style.setProperty('--line-opacity', opacity);

                line.querySelectorAll('.word').forEach(word => {
                    const ws = parseFloat(word.dataset.start), we = parseFloat(word.dataset.end);
                    const fill = time < ws ? 0 : time > we ? 100 : ((time - ws) / (we - ws)) * 100;
                    word.style.setProperty('--fill', fill.toFixed(1));
                });
            });

            if (currentIdx >= 0 && allLines[currentIdx]) {
                allLines[currentIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            if (stickyIdx >= 0) {
                const active = allLines[stickyIdx];
                const lineRect = active.getBoundingClientRect();

                if (lineRect.top < 0) {
                    if (stickyClone !== active) {
                        stickyClone = active;
                        stickyLyric.innerHTML = '';
                        const clone = active.cloneNode(true);
                        clone.style.setProperty('--line-opacity', '1');
                        stickyLyric.appendChild(clone);
                    }
                    stickyLyric.classList.add('visible');

                    const cloneWords = stickyLyric.querySelectorAll('.word');
                    active.querySelectorAll('.word').forEach((w, i) => {
                        if (cloneWords[i]) cloneWords[i].style.setProperty('--fill', w.style.getPropertyValue('--fill'));
                    });
                } else {
                    stickyLyric.classList.remove('visible');
                }
            } else {
                stickyLyric.classList.remove('visible');
            }
        }

        requestAnimationFrame(sync);
    }

    document.getElementById('volume-slider').oninput = e => audio.volume = e.target.value;
    audio.onplay = () => { if(videoAvailable && userWantsLyrics) video.play(); };
    audio.onpause = () => { video.pause(); };
    audio.onended = () => updateBroadcast();  // immediately fetch next state

    setInterval(updateBroadcast, 3000);
    updateBroadcast();
    requestAnimationFrame(sync);
</script>
</body>
</html>
