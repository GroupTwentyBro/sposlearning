<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/media/logo.svg">
    <title>SPOŠLearning</title>
    <link rel="stylesheet" href="/global.css">
    <link rel="stylesheet" href="/navbar.css">
    <link href="/page.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
            options: { ignoreHtmlClass: 'tex2jax_ignore', processHtmlClass: 'tex2jax_process' },
            chtml: { displayAlign: 'left', displayIndent: '1em' }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script type="module" src="/js/index.js"></script>
    <script type="module" src="/js/page.js"></script>
    <script type="module" src="/js/search.js"></script>
</head>

<body>
    <div id="nav">
        <div id="nav-left">
            <div id="nav-icon">
                <span class="icon">book_2</span>
            </div>
            <div id="nav-grade-select-container">
                <button id="nav-grade-select">
                    <span id="grade-text">1st Grade</span>
                    <span class="icon" id="grade-select-drop-icon">arrow_drop_down</span>
                </button>
                <div id="grade-menu" class="hidden">
                    <button id="first-button">1st Grade</button>
                    <button id="second-button">2nd Grade</button>
                    <button id="third-button">3rd Grade</button>
                    <button id="fourth-button">4th Grade</button>
                </div>
            </div>
            <div id="breadcrumbs">
                <a href="/">Home</a>
            </div>
        </div>
        <div id="search">
            <div id="search-box">
                <div id="search-icon">
                    <span class="icon">search</span>
                </div>
                <div id="search-input-div">
                    <input id="search-input" type="text" placeholder="Search">
                </div>
            </div>
            <div id="search-results-container" class="hidden"></div>
        </div>
        <div id="nav-right">
            <button id="login-button" class="nd">
                <span class="icon">login</span>
                Login
            </button>
            <div id="nav-profile" class="nd">
                <button id="account-button">
                    <span class="icon">person</span>
                    <span id="account-button-name">Name</span>
                    <span class="icon" id="account-button-drop-icon">arrow_drop_down</span>
                </button>
                <div id="account-menu" class="hidden">
                    <button id="dashboard-button" class="nd">Dashboard</button>
                    <button id="submissions-button">My Submissions</button>
                    <button id="settings-button">Settings</button>
                    <button id="feedback-button">Send Feedback</button>
                    <hr>
                    <button id="logout-button">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <div id="page-wrapper">
        <div id="skeleton-loader" class="skeleton-loader">
            <div class="skeleton-sidebar">
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
            </div>
            <div class="skeleton-content">
                <div class="skeleton-line full"></div>
                <div class="skeleton-line full"></div>
                <div class="skeleton-line w-80"></div>
                <div style="height: 20px;"></div>
                <div class="skeleton-line full"></div>
                <div class="skeleton-line full"></div>
                <div class="skeleton-line w-90"></div>
                <div style="height: 20px;"></div>
                <div class="skeleton-line w-70"></div>
            </div>
        </div>

        <aside id="toc-sidebar" class="hidden">
            <div id="toc-content">
            </div>
        </aside>

        <main id="main-content" class="hidden">
            <article id="article-content">
            </article>
        </main>
    </div>

    <div id="error-container" class="hidden">
        <div class="error-box">
            <h1>404 - Page Not Found</h1>
            <p id="error-message">The page you're looking for doesn't exist.</p>
            <a href="/" class="btn btn-primary">Back to Home</a>
        </div>
    </div>

    <button id="edit-button" class="nd">
        <span class="icon">edit</span>
    </button>
</body>

</html>
